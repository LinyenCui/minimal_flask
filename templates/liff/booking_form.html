<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>預約叫車</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 16px; line-height: 1.5; color: #222; max-width: 600px; margin: 0 auto; font-size: 16px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .field { margin-bottom: 14px; }
    .field.row { display: flex; gap: 8px; }
    .field.row > div { flex: 1; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; color: #444; }
    .field .req { color: #c0392b; margin-left: 2px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc;
      border-radius: 6px; background: #fff;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #06c755; }
    .actions { margin-top: 24px; display: flex; gap: 8px; }
    /* #post-actions 同時有 .actions(display:flex)，會蓋過 [hidden] 的 display:none，
       需用 ID 特異性更高的規則，hidden 時才真的收起 */
    #post-actions[hidden] { display: none; }
    button { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: 0; cursor: pointer; }
    button[type=submit] { background: #06c755; color: #fff; font-weight: 600; }
    button[type=submit]:disabled { background: #aaa; }
    button.secondary { background: #f3f3f3; color: #333; }
    button.primary { background: #06c755; color: #fff; font-weight: 600; }
    .alert { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .alert.err { background: #fdecea; color: #c0392b; border: 1px solid #f5c2bf; }
    .alert.ok { background: #e8f5e9; color: #1a7a1a; border: 1px solid #b8e0bb; }
    .alert.warn { background: #fff8e1; color: #b85c00; border: 1px solid #ffd180; }
    .loading { text-align: center; color: #666; padding: 40px 0; }
    details { margin-bottom: 14px; border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; }
    details summary { font-weight: 600; cursor: pointer; padding: 4px 0; color: #555; }
    details[open] { background: #fafafa; }
  </style>
</head>
<body>
  <div id="loading" class="loading">載入中…</div>
  <div id="content" hidden>
    <h2>📅 預約叫車</h2>
    <div id="alert"></div>
    <form id="booking-form" novalidate>
      <div class="field row">
        <div>
          <label>日期<span class="req">*</span></label>
          <input name="date" type="date" required>
        </div>
        <div>
          <label>時間<span class="req">*</span></label>
          <input name="time" type="time" required>
        </div>
      </div>
      <div class="field">
        <label>起點<span class="req">*</span></label>
        <input name="start_point" type="text" required maxlength="100" placeholder="例：龍埔街、群創D3哨、東洋後門">
      </div>
      <div class="field">
        <label>終點</label>
        <input name="end_point" type="text" maxlength="100" placeholder="（選填）">
      </div>
      <div class="field">
        <label>途經</label>
        <input name="via_point" type="text" maxlength="100" placeholder="（選填）">
      </div>
      <div class="field">
        <label>類別</label>
        <select name="category">
          <option value="東洋" selected>東洋</option>
          <option value="診所">診所</option>
          <option value="臨時">臨時</option>
        </select>
      </div>

      <details>
        <summary>選填欄位（司機 / 車資 / 乘客）</summary>
        <div class="field" style="margin-top: 10px;">
          <label>指派司機 ID</label>
          <input name="driver_id" type="number" min="1" placeholder="（選填，例 5386）">
        </div>
        <div class="field row">
          <div>
            <label>錶價</label>
            <input name="meter_fare" type="number" min="0" placeholder="（選填）">
          </div>
          <div>
            <label>加成</label>
            <input name="extra_fare" type="number" placeholder="0（可正可負）">
          </div>
        </div>
        <div class="field">
          <label>乘客姓名</label>
          <input name="passenger_name" type="text" maxlength="50" placeholder="（選填）">
        </div>
      </details>

      <div class="actions">
        <button type="button" class="secondary" id="btn-cancel">取消</button>
        <button type="submit" id="btn-submit">建立預約</button>
      </div>
    </form>

    <div id="post-actions" class="actions" hidden>
      <button type="button" class="secondary" id="btn-done">✅ 完成關閉</button>
      <button type="button" class="primary" id="btn-again">✏️ 再預約一筆</button>
    </div>
  </div>

  <script>
    const LIFF_ID = "{{ liff_id }}";

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const alertEl = document.getElementById('alert');
    const form = document.getElementById('booking-form');
    const submitBtn = document.getElementById('btn-submit');
    const cancelBtn = document.getElementById('btn-cancel');
    const postActions = document.getElementById('post-actions');
    const againBtn = document.getElementById('btn-again');
    const doneBtn = document.getElementById('btn-done');

    function showAlert(type, msg) { alertEl.innerHTML = `<div class="alert ${type}">${msg}</div>`; }
    function clearAlert() { alertEl.innerHTML = ''; }

    // 連續預約 push 彙總：逐筆建立先不推,完成/關窗時把 N 筆合成「一則」push
    const pending = [];      // 累積本次連續預約成功建立的班次（給彙總用）
    let flushed = false;     // 防「完成關閉」與 pagehide 收尾保險雙推

    function _getSource() {
      const p = new URLSearchParams(window.location.search);
      const gid = p.get('gid');
      const rid = p.get('rid');
      if (gid) return { type: 'group', groupId: gid, roomId: null };
      if (rid) return { type: 'room', groupId: null, roomId: rid };
      return null;
    }

    // 把累積的 pending 班次彙總成一則 push（成功才清空；失敗放回旗標讓收尾保險重試）
    // keepalive：即使緊接著關窗,請求仍能送達（mobile WebView 關窗瞬間不被砍）
    async function flushPending() {
      if (flushed || pending.length === 0) return;
      flushed = true;
      const sent = pending.slice();        // 本批快照（只送這幾筆）
      const payload = { bookings: sent };
      const src = _getSource();
      if (src) payload.source = src;
      try {
        const resp = await fetch('/liff/booking/batch_notify', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + _safeIdToken(),
          },
          body: JSON.stringify(payload),
          keepalive: true,
        });
        if (!resp.ok) throw new Error('HTTP ' + resp.status);
        // 只移除「已送出的這批」,不清空整個陣列 —— 避免 flush 在途時又新增的
        // 班次(pending 只 append,按 count splice 安全)被一起清掉而漏推
        pending.splice(0, sent.length);
      } catch (e) {
        console.warn('[booking] batch_notify failed', e);
        flushed = false;   // 失敗：放回旗標，讓收尾保險還能再試
      }
    }

    // flushPending 在第一個 await 前已同步發出 fetch（keepalive 保命）,故不 await 即可關窗,
    // 避免網路卡住時「按了完成卻關不掉」
    function closeWithFlush() {
      flushPending();
      _closeOrBack();
    }

    // 防 LIFF SDK 偶爾回傳含 \r \n \0 的 idToken 導致 Headers.set 炸
    // (iOS Safari WebView 上常見「The string did not match the expected pattern.」)
    function _safeIdToken() {
      const t = liff.getIDToken();
      if (!t) {
        console.warn('[_safeIdToken] getIDToken returned falsy:', t);
        return '';
      }
      // 先 trim 兩邊空白，再 strip 所有非「ASCII printable」字元（0x21-0x7E）
      // JWT idToken 應該只含 [A-Za-z0-9_\-\.]，任何非該範圍都不該保留
      const cleaned = t.trim().replace(/[^\x21-\x7E]/g, '');
      if (cleaned.length !== t.length) {
        const codes = Array.from(t.slice(0, 30))
          .map(c => c.charCodeAt(0).toString(16))
          .join(' ');
        console.warn(
          `[_safeIdToken] cleaned ${t.length - cleaned.length} bad chars; ` +
          `original len=${t.length}, clean len=${cleaned.length}, ` +
          `first 30 hex: ${codes}`
        );
      }
      return cleaned;
    }
    function setLoading(text) { loadingEl.textContent = text; loadingEl.hidden = false; contentEl.hidden = true; }
    function showContent() { loadingEl.hidden = true; contentEl.hidden = false; }

    function _today() {
      const d = new Date();
      const yy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    async function init() {
      if (!LIFF_ID) { setLoading('LIFF_ID 未設定'); return; }
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (e) {
        setLoading('LIFF init 失敗：' + e.message);
        return;
      }
      if (!liff.isLoggedIn()) {
        // PC LIFF OAuth2 redirect_uri 必須在白名單 — 用 LIFF URL 才會通過
        liff.login({ redirectUri: 'https://liff.line.me/' + LIFF_ID + window.location.search });
        return;
      }
      // 預設日期 = 今天，且 picker 最早只能選今天（過去日期擋掉，避免誤選）
      const dateEl = form.elements.namedItem('date');
      dateEl.value = _today();
      dateEl.min = _today();
      showContent();
    }

    function _closeOrBack() {
      if (liff.isInClient && liff.isInClient()) liff.closeWindow();
      else history.back();
    }

    // 取消 / 完成關閉：先把連續預約的 N 筆彙總推一則,再關窗
    cancelBtn.addEventListener('click', closeWithFlush);
    doneBtn.addEventListener('click', () => { doneBtn.disabled = true; closeWithFlush(); });

    againBtn.addEventListener('click', () => {
      // 保留上一筆日期：連續預約多班的主場景是同日批次，
      // form.reset() 後若重設為今天，會默默撤銷使用者剛選的日期 → 跑錯日
      const dateEl = form.elements.namedItem('date');
      const previousDate = dateEl.value;
      form.reset();
      // form.reset() 不會收合 <details>，手動收回
      form.querySelectorAll('details[open]').forEach((d) => { d.open = false; });
      // 還原上一筆日期；異常為空才退回今天。min 仍鎖今天避免手動選過去
      dateEl.value = previousDate || _today();
      dateEl.min = _today();
      clearAlert();
      submitBtn.disabled = false;
      submitBtn.textContent = '建立預約';
      postActions.hidden = true;
      form.hidden = false;
      window.scrollTo(0, 0);
      const timeEl = form.elements.namedItem('time');
      if (timeEl && timeEl.focus) timeEl.focus();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      // 過去時間防呆：date+time 早於現在 → 跳 confirm（給「補登過去班次」彈性，但不靜默通過）
      const fd = new FormData(form);
      const dateStr = fd.get('date');
      const timeStr = fd.get('time');
      if (dateStr && timeStr) {
        const target = new Date(`${dateStr}T${timeStr}`);
        const now = new Date();
        // 5 分鐘容錯（手機/server 時鐘漂移）
        if (target.getTime() < now.getTime() - 5 * 60 * 1000) {
          if (!confirm(`預約時間 ${dateStr} ${timeStr} 已過，仍要建立嗎？\n（補登過去班次才按確定）`)) {
            return;
          }
        }
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '建立中…';
      try {
        const idToken = _safeIdToken();
        const payload = Object.fromEntries(fd.entries());

        // 連續預約：各筆先不推,累積到「完成關閉」時彙總成一則 push
        payload.suppress_push = true;
        // 從 URL params 拿真實 group/room ID（liff.getContext 給的 UUID 不能用）
        const src = _getSource();
        if (src) payload.source = src;

        const resp = await fetch('/liff/booking', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + idToken,
          },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
        const tid = data.trip && data.trip.trip_id;
        // 累積本筆給收尾彙總（顯示欄位用表單值，trip_id 用回傳值）
        pending.push({
          trip_id: tid,
          date: payload.date,
          time: payload.time,
          start_point: payload.start_point,
          end_point: payload.end_point,
        });
        flushed = false;   // 又新增一筆 → 重置,確保收尾會再推
        showAlert('ok', `✅ 已建立預約 #${tid}，可繼續預約下一班`);
        // 起/終點未對應客戶簡稱 → 黃色警示（只在表單內提醒，不佔 push 額度）
        const warns = data.warnings || [];
        if (warns.length) {
          alertEl.innerHTML += warns
            .map(w => `<div class="alert warn">⚠️ ${w}</div>`)
            .join('');
        }
        // 連續預約：不自動關窗，改顯示「再預約一筆 / 完成關閉」
        form.hidden = true;
        postActions.hidden = false;
        window.scrollTo(0, 0);
      } catch (err) {
        showAlert('err', '❌ ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '建立預約';
      }
    });

    // 收尾保險：使用者直接滑掉/關窗（沒按「完成關閉」）時,仍把已建立的連續預約
    // 彙總推一則（keepalive 讓關窗瞬間的請求仍送得出去）。
    // 只用 pagehide(真正卸載) —— 刻意不用 visibilitychange,因為它在切 App /
    // 下拉通知 / 鎖屏都會觸發,會在使用者只是暫時切背景(訂一筆→切出查地址→
    // 回來訂下一筆,是派班高頻動作)時提早 flush,把同一次連續預約拆成多則 push,
    // 破壞 N→1 省額度目標。
    window.addEventListener('pagehide', () => flushPending());

    init();
  </script>
</body>
</html>
