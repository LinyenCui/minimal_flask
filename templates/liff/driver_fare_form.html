<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>回報車資</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    /* 極簡大字版 —— 司機不擅長手機操作：字大、按鈕大、沒有下拉沒有日期選擇器 */
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 16px 14px 110px; line-height: 1.5; color: #1a1a1a;
      max-width: 640px; margin: 0 auto; font-size: 18px;
      background: #eef1f5;   /* 淺灰底襯白卡，畫面才不會一片死白 */
    }
    h1 {
      font-size: 24px; margin: 0 0 16px; line-height: 1.35;
      padding-left: 12px; border-left: 6px solid #06c755;   /* 綠色標題條 */
    }
    .loading { text-align: center; color: #666; padding: 60px 0; font-size: 20px; }

    /* 未綁定：一位司機一顆大按鈕 */
    .who-btn {
      display: block; width: 100%; min-height: 64px; margin-bottom: 12px;
      padding: 16px; font-size: 22px; font-weight: 700; text-align: center;
      border: 2px solid #06c755; border-radius: 12px;
      background: #fff; color: #0a5c2b; cursor: pointer;
      box-shadow: 0 2px 8px rgba(20,30,50,.08);
    }
    .who-btn:active { background: #e8f5e9; }
    .who-btn:disabled { opacity: .5; }

    /* 已綁定：待補車資卡片 */
    .card {
      position: relative; overflow: hidden;
      border: 1px solid #e2e6ea; border-radius: 14px; padding: 16px 14px;
      margin-bottom: 14px; background: #fff;
      box-shadow: 0 2px 6px rgba(20,30,50,.07);
    }
    /* 類別色條：用 ::before 而不是 border-left / box-shadow —— 那兩個會被
       填完變綠的 .card.done 覆蓋掉，色條必須在填完之後仍看得見 */
    .card::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 0;
      background: transparent;
    }
    .card.cat-on::before { width: 7px; }
    /* 診所（量最大）維持原樣：不上色條、不染底，其他類別才跳出來 */
    .card.cat-a::before { background: #e08a1e; }   /* 東洋 */
    .card.cat-a          { background: #fffaf2; }
    .card.cat-b::before { background: #7c4dd4; }   /* 臨時 */
    .card.cat-b          { background: #faf7ff; }
    .card.cat-c::before { background: #0d9488; }   /* 之後新增的類別自動輪用 */
    .card.cat-c          { background: #f2fbfa; }
    .card.cat-d::before { background: #d9457f; }
    .card.cat-d          { background: #fff5f9; }
    .card.cat-e::before { background: #4a6fb5; }
    .card.cat-e          { background: #f5f8fd; }
    /* 填完變綠時，底色讓給 .done，但色條保留（仍看得出是哪個類別） */
    .card.done.cat-a, .card.done.cat-b, .card.done.cat-c,
    .card.done.cat-d, .card.done.cat-e { background: #f3fbf5; }
    .card.done {
      border-color: #06c755; background: #f3fbf5;
      box-shadow: 0 2px 8px rgba(6,199,85,.18);
    }
    .card .when { font-size: 22px; font-weight: 700; margin-bottom: 4px; word-break: break-word; }
    .card .meta { font-size: 14px; color: #6b7280; margin-bottom: 12px; }
    .tag {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 13px; font-weight: 700; margin-right: 6px; vertical-align: middle;
      background: #eceff3; color: #55606e;
    }
    .tag.cat-diag { background: #e3f0ff; color: #14539a; }   /* 診所 */
    .tag.cat-a    { background: #fff0dd; color: #9a5a12; }
    .tag.cat-b    { background: #f0e7ff; color: #5b3a9e; }
    .tag.cat-c    { background: #dff5f2; color: #0b6b62; }
    .tag.cat-d    { background: #ffe6f0; color: #a32a5e; }
    .tag.cat-e    { background: #e8eefb; color: #2f4e8f; }
    /* 週統計的類別小計：左側同色小方塊，跟班次列表對得起來 */
    .subtot .swatch {
      display: inline-block; width: 10px; height: 10px; border-radius: 3px;
      margin-right: 7px; vertical-align: middle; background: #b9c2cc;
    }
    .subtot .swatch.cat-a { background: #e08a1e; }
    .subtot .swatch.cat-b { background: #7c4dd4; }
    .subtot .swatch.cat-c { background: #0d9488; }
    .subtot .swatch.cat-d { background: #d9457f; }
    .subtot .swatch.cat-e { background: #4a6fb5; }
    .subtot .swatch.cat-diag { background: #4f8fd6; }
    .row { display: flex; align-items: center; gap: 10px; margin-top: 10px; }
    .row label { width: 74px; flex: 0 0 74px; font-size: 19px; font-weight: 700; }
    .row input {
      flex: 1; min-width: 0; height: 56px; padding: 8px 12px;
      font-size: 24px; text-align: right;
      border: 2px solid #cfd5dc; border-radius: 10px; background: #fbfcfd; color: #111;
    }
    .row input:focus {
      outline: none; border-color: #06c755; background: #fff;
      box-shadow: 0 0 0 3px rgba(6,199,85,.15);
    }
    .row .unit { font-size: 18px; color: #666; }
    .hint { font-size: 14px; color: #888; margin-top: 8px; }
    .card .result { margin-top: 10px; font-size: 18px; font-weight: 700; }
    .card .result.ok { color: #1a7a1a; }
    .card .result.err { color: #c0392b; }

    .empty { text-align: center; font-size: 22px; color: #444; padding: 40px 10px; line-height: 1.6; }

    /* 底部大送出鈕 */
    .footer {
      position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 14px;
      background: rgba(255,255,255,.97); border-top: 1px solid #e5e5e5;
    }
    .footer .inner { max-width: 640px; margin: 0 auto; }
    #btn-submit {
      width: 100%; min-height: 64px; font-size: 24px; font-weight: 700;
      border: 0; border-radius: 12px; background: #06c755; color: #fff; cursor: pointer;
      box-shadow: 0 3px 10px rgba(6,199,85,.35);
    }
    #btn-submit:disabled { background: #b5b5b5; }

    .alert { padding: 12px 14px; border-radius: 10px; margin-bottom: 14px; font-size: 18px; }
    .alert.err { background: #fdecea; color: #c0392b; border: 2px solid #f5c2bf; }
    .alert.ok { background: #e8f5e9; color: #1a7a1a; border: 2px solid #b8e0bb; }

    .more { text-align: center; margin: 6px 0 4px; }
    .more a { font-size: 15px; color: #777; text-decoration: underline; cursor: pointer; }
    [hidden] { display: none !important; }

    /* 管理司機專用：「檢視誰的車資」切換列（一般司機這一區完全不 render） */
    .switcher { margin-bottom: 16px; }
    .sw-toggle {
      width: 100%; min-height: 56px; padding: 12px 14px;
      font-size: 20px; font-weight: 700; text-align: left;
      border: 2px solid #06c755; border-radius: 12px;
      background: #f1f9f2; color: #0a5c2b; cursor: pointer;
      box-shadow: 0 2px 6px rgba(20,30,50,.07);
    }
    .sw-list { margin-top: 8px; }
    .sw-list button {
      display: block; width: 100%; min-height: 56px; margin-bottom: 8px;
      padding: 12px; font-size: 20px; font-weight: 700; text-align: center;
      border: 2px solid #ccc; border-radius: 12px;
      background: #fff; color: #1a1a1a; cursor: pointer;
    }
    .sw-list button.cur { border-color: #06c755; background: #e8f5e9; color: #0a5c2b; }
    .sw-list button.off { color: #999; border-color: #e5e5e5; font-weight: 400; }

    /* 本週車資（唯讀清單，在待補清單下方） */
    .week {
      margin-top: 24px; padding: 16px 14px; background: #fff;
      border: 1px solid #e2e6ea; border-radius: 14px;
      box-shadow: 0 2px 6px rgba(20,30,50,.07);
    }
    .week h2 {
      font-size: 20px; margin: 0 0 10px; padding-bottom: 8px;
      border-bottom: 2px solid #eef1f5; color: #14539a;
    }
    .wrow {
      display: flex; align-items: baseline; gap: 10px;
      padding: 9px 0 9px 9px; border-bottom: 1px solid #f0f0f0; font-size: 17px;
      /* 透明色條佔位：診所（無色）跟其他類別的文字才會對齊在同一條線上 */
      border-left: 5px solid transparent;
    }
    /* 診所量最大 → 維持原樣不上色；其他類別才跳出來 */
    .wrow.cat-a { border-left-color: #e08a1e; background: #fffaf2; }
    .wrow.cat-b { border-left-color: #7c4dd4; background: #faf7ff; }
    .wrow.cat-c { border-left-color: #0d9488; background: #f2fbfa; }
    .wrow.cat-d { border-left-color: #d9457f; background: #fff5f9; }
    .wrow.cat-e { border-left-color: #4a6fb5; background: #f5f8fd; }
    .wrow .d { flex: 0 0 48px; color: #555; font-weight: 700; }
    .wrow .r { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .wrow .a { flex: 0 0 auto; font-weight: 700; }
    .wrow .a.todo { color: #999; font-weight: 400; }
    .week .subtot { display: flex; justify-content: space-between; align-items: baseline;
                    margin-top: 8px; padding-top: 8px; border-top: 1px dashed #ddd;
                    font-size: 19px; font-weight: 600; }
    .week .subtot:first-of-type { margin-top: 14px; }
    .week .subtot .n { font-size: 14px; color: #8a94a0; font-weight: 400; margin-left: 6px; }
    .week .total {
      margin-top: 14px; padding: 12px 14px; border-radius: 10px;
      background: #f3fbf5; border: 1px solid #cdecd7; color: #0a5c2b;
      font-size: 24px; font-weight: 700;
    }
    .week .total .sub { font-size: 15px; color: #777; font-weight: 400; }
    .week .none { color: #888; padding: 10px 0; font-size: 17px; }
  </style>
</head>
<body>
  <div id="loading" class="loading">載入中…</div>

  <!-- 未綁定：請問你是哪一位？ -->
  <div id="who" hidden>
    <h1>請問你是哪一位？</h1>
    <div id="who-alert"></div>
    <div id="who-list"></div>
  </div>

  <!-- 已綁定：今天要補的車資 -->
  <div id="main" hidden>
    <!-- 管理司機才會被塞內容；一般司機這裡永遠是空的（不是隱藏，是根本沒 render） -->
    <div id="switcher-slot"></div>
    <h1 id="main-title">今天要補的車資</h1>
    <div id="alert"></div>
    <div id="cards"></div>
    <div id="empty" class="empty" hidden>今天沒有需要補車資的班次 👍</div>
    <div class="more"><a id="link-more">看前 14 天</a></div>
    <div id="week-slot"></div>
  </div>

  <div class="footer" id="footer" hidden>
    <div class="inner">
      <button type="button" id="btn-submit">✅ 送出</button>
    </div>
  </div>

  <script>
    const LIFF_ID = "{{ liff_id }}";

    const loadingEl = document.getElementById('loading');
    const whoEl = document.getElementById('who');
    const whoListEl = document.getElementById('who-list');
    const whoAlertEl = document.getElementById('who-alert');
    const mainEl = document.getElementById('main');
    const titleEl = document.getElementById('main-title');
    const alertEl = document.getElementById('alert');
    const cardsEl = document.getElementById('cards');
    const emptyEl = document.getElementById('empty');
    const footerEl = document.getElementById('footer');
    const submitBtn = document.getElementById('btn-submit');
    const moreLink = document.getElementById('link-more');
    const swSlot = document.getElementById('switcher-slot');
    const weekSlot = document.getElementById('week-slot');

    let DAYS = 1;
    let WEEK_OFFSET = 0;   // 0=本週, -1=上週…
    let ME = null;        // 登入的這個人（管理司機才有切換能力）
    let VIEW_ID = null;   // 目前檢視的司機（管理司機可切；一般司機恆為自己）
    let WEEK = null;

    function setLoading(msg) {
      loadingEl.textContent = msg;
      loadingEl.hidden = false;
      whoEl.hidden = true; mainEl.hidden = true; footerEl.hidden = true;
    }
    function showAlert(el, type, msg) { el.innerHTML = `<div class="alert ${type}">${esc(msg)}</div>`; }
    function clearAlert(el) { el.innerHTML = ''; }

    // 地點／乘客名來自 DB，插進 innerHTML 前一律轉義
    function esc(v) {
      return String(v == null ? '' : v)
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function fmtMD(iso) {                 // 'YYYY-MM-DD' → 'M/D'
      if (!iso) return '';
      const p = String(iso).split('-');
      return p.length < 3 ? '' : `${parseInt(p[1], 10)}/${parseInt(p[2], 10)}`;
    }
    function fmtMoney(n) { return (Number(n) || 0).toLocaleString('en-US'); }

    // 防 LIFF SDK 偶爾回傳含 \r \n \0 的 idToken（iOS Safari WebView 常見）
    function _safeIdToken() {
      const t = liff.getIDToken();
      if (!t) return '';
      return t.trim().replace(/[^\x21-\x7E]/g, '');
    }

    async function api(path, options) {
      const opt = options || {};
      const headers = { 'Authorization': 'Bearer ' + _safeIdToken() };
      if (opt.body) headers['Content-Type'] = 'application/json';
      const resp = await fetch(path, {
        method: opt.method || 'GET',
        headers: headers,
        body: opt.body ? JSON.stringify(opt.body) : undefined,
      });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      return data;
    }

    // ===== 未綁定：一位司機一顆大按鈕 =====
    function renderWho(drivers) {
      whoListEl.innerHTML = '';
      if (!drivers.length) {
        whoListEl.innerHTML = '<div class="empty">目前沒有可選的司機<br>請聯絡管理員</div>';
      }
      drivers.forEach(d => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'who-btn';
        b.textContent = d.display_name;
        b.addEventListener('click', () => bindMe(d.id, b));
        whoListEl.appendChild(b);
      });
      loadingEl.hidden = true;
      whoEl.hidden = false;
      mainEl.hidden = true;
      footerEl.hidden = true;
    }

    async function bindMe(driverId, btn) {
      clearAlert(whoAlertEl);
      whoListEl.querySelectorAll('button').forEach(b => b.disabled = true);
      const orig = btn.textContent;
      btn.textContent = '設定中…';
      try {
        const data = await api('/liff/driver/fare/bind', {
          method: 'POST', body: { driver_id: driverId, days: DAYS },
        });
        applyState(data);
      } catch (e) {
        showAlert(whoAlertEl, 'err', '❌ ' + e.message);
        btn.textContent = orig;
        whoListEl.querySelectorAll('button').forEach(b => b.disabled = false);
      }
    }

    // ===== 已綁定：待補車資卡片 =====
    // 類別 → 色票代號。診所（量最大）維持原樣不上色條；
    // 東洋／臨時固定色；日後新增的類別用字串雜湊自動輪用剩下的色票，
    // 不必改程式，而且同一個類別永遠拿到同一個顏色。
    const CAT_FIXED = { '診所': 'diag', '東洋': 'a', '臨時': 'b' };
    const CAT_POOL = ['c', 'd', 'e'];
    function catSlot(category) {
      const c = (category || '').trim();
      if (!c) return '';
      if (CAT_FIXED[c]) return CAT_FIXED[c];
      let h = 0;
      for (let i = 0; i < c.length; i++) h = (h * 31 + c.charCodeAt(i)) >>> 0;
      return CAT_POOL[h % CAT_POOL.length];
    }

    function renderCards(driver, trips) {
      // 抬頭用司機編號（用戶定調：有些司機不知道姓名，編號才是共同語言）
      titleEl.textContent = `司機 ${driver.id} ${DAYS > 1 ? '這幾天' : '今天'}要補的車資`;
      cardsEl.innerHTML = '';
      trips.forEach(t => {
        const card = document.createElement('div');
        const slot = catSlot(t.category);
        // 診所不上色條（維持原樣）；其他類別才 cat-on + 顏色
        card.className = 'card'
          + (slot && slot !== 'diag' ? ` cat-on cat-${slot}` : '');
        card.dataset.source = t.source;
        card.dataset.id = t.id;
        const head = t.time ? `${t.time}　${t.route}` : t.route;
        const metaBits = [];
        if (!t.time && t.date) metaBits.push(t.date.slice(5).replace('-', '/'));
        else if (DAYS > 1 && t.date) metaBits.push(t.date.slice(5).replace('-', '/'));

        if (t.passenger_name) metaBits.push(t.passenger_name);
        card.innerHTML = `
          <div class="when">${esc(head)}</div>
          <div class="meta">${t.category ? `<span class="tag cat-${slot}">${esc(t.category)}</span>` : ''}${esc(metaBits.join('　'))}</div>
          <div class="row">
            <label>車資</label>
            <input class="in-meter" type="text" inputmode="numeric" pattern="[0-9]*" placeholder="0">
            <span class="unit">元</span>
          </div>
          <div class="row">
            <label>加成</label>
            <input class="in-extra" type="text" inputmode="numeric" placeholder="免填">
            <span class="unit">元</span>
          </div>
          <div class="result"></div>
        `;
        cardsEl.appendChild(card);
      });
      emptyEl.hidden = trips.length > 0;
      footerEl.hidden = trips.length === 0;
      moreLink.textContent = DAYS > 1 ? '只看今天' : '看前 14 天';
      loadingEl.hidden = true;
      whoEl.hidden = true;
      mainEl.hidden = false;
      submitBtn.disabled = false;
      submitBtn.textContent = '✅ 送出';
    }

    // ===== 管理司機：切換「檢視誰的車資」=====
    function renderSwitcher(state) {
      swSlot.innerHTML = '';
      const me = state.me, viewing = state.viewing;
      if (!me || !me.is_manager || !viewing) return;   // 一般司機：整區不 render

      const box = document.createElement('div');
      box.className = 'switcher';

      const toggle = document.createElement('button');
      toggle.type = 'button';
      toggle.className = 'sw-toggle';
      toggle.textContent = `檢視：司機 ${viewing.id} ▼`;

      const list = document.createElement('div');
      list.className = 'sw-list';
      list.hidden = true;

      (state.drivers_all || []).forEach(d => {
        const b = document.createElement('button');
        b.type = 'button';
        b.textContent = d.display_name + (d.is_active ? '' : '（停用）');
        if (!d.is_active) b.classList.add('off');
        if (d.id === viewing.id) b.classList.add('cur');
        b.addEventListener('click', async () => {
          list.hidden = true;
          if (d.id === VIEW_ID) return;
          setLoading('載入中…');
          try { await loadState(DAYS, d.id); }
          catch (e) { setLoading('載入失敗：' + e.message); }
        });
        list.appendChild(b);
      });

      toggle.addEventListener('click', () => { list.hidden = !list.hidden; });
      box.appendChild(toggle);
      box.appendChild(list);
      swSlot.appendChild(box);
    }

    // ===== 本週車資（唯讀）=====
    function renderWeek(week) {
      weekSlot.innerHTML = '';
      if (!week) return;
      const box = document.createElement('div');
      box.className = 'week';

      const h = document.createElement('h2');
      const wname = WEEK_OFFSET === 0 ? '本週'
                  : WEEK_OFFSET === -1 ? '上週' : `前 ${-WEEK_OFFSET} 週`;
      h.textContent = `${wname}車資（${fmtMD(week.start)}～${fmtMD(week.end)}）`;
      box.appendChild(h);

      const items = week.items || [];
      if (!items.length) {
        const none = document.createElement('div');
        none.className = 'none';
        none.textContent = (WEEK_OFFSET === 0 ? '本週' : '該週') + '目前沒有班次';
        box.appendChild(none);
      }
      items.forEach(it => {
        const row = document.createElement('div');
        const slot = catSlot(it.category);
        row.className = 'wrow' + (slot && slot !== 'diag' ? ` cat-${slot}` : '');
        row.innerHTML =
          `<span class="d">${esc(fmtMD(it.date))}</span>` +
          `<span class="r">${esc(it.route)}</span>` +
          (it.has_fare ? `<span class="a">${fmtMoney(it.total)}</span>`
                       : `<span class="a todo">待補</span>`);
        box.appendChild(row);
      });

      // 各類別小計（診所／東洋／臨時…）— 先分類再合計
      (week.by_category || []).forEach(a => {
        const s = document.createElement('div');
        s.className = 'subtot';
        s.innerHTML =
          `<span><i class="swatch cat-${catSlot(a.category)}"></i>` +
          `${esc(a.category)}<span class="n">${a.filled_count}/${a.count} 筆</span></span>` +
          `<span>${fmtMoney(a.sum_amount)} 元</span>`;
        box.appendChild(s);
      });

      const total = document.createElement('div');
      total.className = 'total';
      total.innerHTML =
        `本週合計 ${fmtMoney(week.sum_amount)} 元 ` +
        `<span class="sub">（已填 ${Number(week.filled_count) || 0}` +
        `／共 ${Number(week.count) || 0} 筆）</span>`;
      box.appendChild(total);

      const nav = document.createElement('div');
      nav.className = 'more';
      const a = document.createElement('a');
      a.textContent = WEEK_OFFSET === 0 ? '看上週' : '回到本週';
      a.addEventListener('click', async () => {
        WEEK_OFFSET = WEEK_OFFSET === 0 ? -1 : 0;
        try {
          const data = await api(stateUrl(DAYS));
          WEEK = data.week || null;
          renderWeek(WEEK);
        } catch (e) { alert('載入失敗：' + e.message); }
      });
      nav.appendChild(a);
      box.appendChild(nav);
      weekSlot.appendChild(box);
    }

    function applyState(state) {
      DAYS = state.days || DAYS;
      ME = state.me || null;
      VIEW_ID = (state.viewing && state.viewing.id) || null;
      WEEK = state.week || null;
      clearAlert(alertEl);
      if (!state.bound) { renderWho(state.drivers || []); return; }
      renderSwitcher(state);
      renderCards(state.viewing || state.driver, state.trips || []);
      renderWeek(WEEK);
    }

    function stateUrl(days) {
      let url = `/liff/driver/fare/state?days=${days}`;
      if (VIEW_ID) url += `&driver_id=${VIEW_ID}`;
      if (WEEK_OFFSET) url += `&week=${WEEK_OFFSET}`;
      return url;
    }

    async function loadState(days, driverId) {
      DAYS = days;
      if (driverId !== undefined && driverId !== null) VIEW_ID = driverId;
      const data = await api(stateUrl(days));
      applyState(data);
    }

    // 送出成功後只把「本週車資」重抓一次（不動卡片，失敗訊息才留得住）
    async function refreshWeek() {
      try {
        const data = await api(stateUrl(DAYS));
        WEEK = data.week || null;
        renderWeek(WEEK);
      } catch (e) { /* 合計沒更新不影響已送出的車資，安靜略過 */ }
    }

    moreLink.addEventListener('click', async () => {
      const next = DAYS > 1 ? 1 : 14;
      setLoading('載入中…');
      try { await loadState(next); }
      catch (e) { setLoading('載入失敗：' + e.message); }
    });

    // ===== 送出 =====
    function collectItems() {
      const items = [];
      const bad = [];
      cardsEl.querySelectorAll('.card:not(.done)').forEach(card => {
        const meterRaw = (card.querySelector('.in-meter').value || '').trim();
        const extraRaw = (card.querySelector('.in-extra').value || '').trim();
        if (!meterRaw && !extraRaw) return;   // 沒填的整張跳過
        const item = { source: card.dataset.source, id: parseInt(card.dataset.id, 10) };
        if (meterRaw !== '') {
          const m = parseInt(meterRaw, 10);
          if (Number.isNaN(m)) { bad.push(card); return; }
          item.meter_fare = m;
        }
        if (extraRaw !== '') {
          const x = parseInt(extraRaw, 10);
          if (Number.isNaN(x)) { bad.push(card); return; }
          item.extra_fare = x;
        }
        items.push(item);
      });
      return { items, bad };
    }

    submitBtn.addEventListener('click', async () => {
      clearAlert(alertEl);
      const { items, bad } = collectItems();
      if (bad.length) { showAlert(alertEl, 'err', '❌ 車資請填數字'); return; }
      if (!items.length) { showAlert(alertEl, 'err', '❌ 還沒填任何車資'); return; }

      submitBtn.disabled = true;
      submitBtn.textContent = '送出中…';
      let data;
      try {
        const payload = { items: items };
        if (VIEW_ID) payload.driver_id = VIEW_ID;   // 管理司機代填；一般司機後端會忽略
        data = await api('/liff/driver/fare/submit', { method: 'POST', body: payload });
      } catch (e) {
        showAlert(alertEl, 'err', '❌ ' + e.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '✅ 送出';
        return;
      }

      let okN = 0, failN = 0;
      (data.results || []).forEach(r => {
        const card = cardsEl.querySelector(`.card[data-source="${r.source}"][data-id="${r.id}"]`);
        if (!card) return;
        const box = card.querySelector('.result');
        if (r.ok) {
          okN++;
          card.classList.add('done');
          box.className = 'result ok';
          box.textContent = '✅ 已送出';
          setTimeout(() => card.remove(), 1200);   // 成功的卡片消失
        } else {
          failN++;
          box.className = 'result err';
          box.textContent = '❌ ' + (r.error || '失敗');
        }
      });

      setTimeout(() => {
        const left = cardsEl.querySelectorAll('.card').length;
        emptyEl.hidden = left > 0;
        footerEl.hidden = left === 0;
      }, 1300);

      showAlert(alertEl, failN ? 'err' : 'ok',
        failN ? `✅ 成功 ${okN} 筆，❌ 失敗 ${failN} 筆（失敗的請看下方紅字）`
              : `✅ 已送出 ${okN} 筆，謝謝！`);
      submitBtn.disabled = false;
      submitBtn.textContent = '✅ 送出';
      if (okN) refreshWeek();   // 本週合計跟著跳
    });

    async function init() {
      if (!LIFF_ID) { setLoading('LIFF_ID 未設定'); return; }
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (e) {
        setLoading('LIFF init 失敗：' + e.message);
        return;
      }
      if (!liff.isLoggedIn()) {
        // PC LIFF OAuth2 redirect_uri 必須在白名單 — 用 LIFF URL 才會通過
        liff.login({ redirectUri: 'https://liff.line.me/' + LIFF_ID + window.location.search });
        return;
      }
      try {
        const params = new URLSearchParams(window.location.search);
        await loadState(parseInt(params.get('days'), 10) || 1);
      } catch (e) {
        setLoading('載入失敗：' + e.message);
      }
    }

    init();
  </script>
</body>
</html>
