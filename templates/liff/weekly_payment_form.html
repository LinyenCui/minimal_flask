<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>記錄上週扣款</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 16px; line-height: 1.5; color: #222; max-width: 600px; margin: 0 auto; font-size: 16px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; color: #444; }
    .field .req { color: #c0392b; margin-left: 2px; }
    .field input {
      width: 100%; padding: 10px 12px; font-size: 18px; border: 1px solid #ccc;
      border-radius: 6px; background: #fff; text-align: right;
    }
    .field input:focus { outline: none; border-color: #FF6D00; }
    .helper { font-size: 12px; color: #888; margin-top: 4px; }
    .info-box {
      background: #fff3e0; border: 1px solid #ffcc80; border-radius: 6px;
      padding: 12px; margin-bottom: 14px; font-size: 14px;
    }
    .info-box strong { color: #e65100; }
    .actions { margin-top: 24px; display: flex; gap: 8px; }
    button { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: 0; cursor: pointer; }
    button[type=submit] { background: #FF6D00; color: #fff; font-weight: 600; }
    button[type=submit]:disabled { background: #aaa; }
    button.secondary { background: #f3f3f3; color: #333; }
    .alert { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .alert.err { background: #fdecea; color: #c0392b; border: 1px solid #f5c2bf; }
    .alert.ok { background: #e8f5e9; color: #1a7a1a; border: 1px solid #b8e0bb; }
    .loading { text-align: center; color: #666; padding: 40px 0; }
  </style>
</head>
<body>
  <div id="loading" class="loading">載入中…</div>
  <div id="content" hidden>
    <h2>💵 記錄上週扣款</h2>
    <div id="alert"></div>
    <div class="info-box">
      ⏰ 系統會自動鎖定時間為 <strong id="last-saturday-text">上週六 23:59</strong><br>
      用途：每週固定的車資扣款記錄
    </div>
    <form id="weekly-form" novalidate>

      <div class="field">
        <label>上週總金額（NT$）<span class="req">*</span></label>
        <input name="amount" id="input-amount" type="number" min="1" required placeholder="例：12500">
        <div class="helper" id="calc-hint">計算系統金額中…</div>
        <div class="helper" id="diff-hint" style="color:#c0392b; font-weight:600;"></div>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="btn-cancel">取消</button>
        <button type="submit" id="btn-submit">確認扣款</button>
      </div>
    </form>
  </div>

  <script>
    const LIFF_ID = "{{ liff_id }}";

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const alertEl = document.getElementById('alert');
    const lastSatEl = document.getElementById('last-saturday-text');
    const form = document.getElementById('weekly-form');
    const submitBtn = document.getElementById('btn-submit');
    const cancelBtn = document.getElementById('btn-cancel');

    function showAlert(type, msg) { alertEl.innerHTML = `<div class="alert ${type}">${msg}</div>`; }
    function clearAlert() { alertEl.innerHTML = ''; }

    // 防 LIFF SDK 偶爾回傳含 \r \n \0 的 idToken 導致 Headers.set 炸
    // (iOS Safari WebView 上常見「The string did not match the expected pattern.」)
    function _safeIdToken() {
      const t = liff.getIDToken();
      if (!t) {
        console.warn('[_safeIdToken] getIDToken returned falsy:', t);
        return '';
      }
      // 先 trim 兩邊空白，再 strip 所有非「ASCII printable」字元（0x21-0x7E）
      // JWT idToken 應該只含 [A-Za-z0-9_\-\.]，任何非該範圍都不該保留
      const cleaned = t.trim().replace(/[^\x21-\x7E]/g, '');
      if (cleaned.length !== t.length) {
        const codes = Array.from(t.slice(0, 30))
          .map(c => c.charCodeAt(0).toString(16))
          .join(' ');
        console.warn(
          `[_safeIdToken] cleaned ${t.length - cleaned.length} bad chars; ` +
          `original len=${t.length}, clean len=${cleaned.length}, ` +
          `first 30 hex: ${codes}`
        );
      }
      return cleaned;
    }
    function setLoading(t) { loadingEl.textContent = t; loadingEl.hidden = false; contentEl.hidden = true; }
    function showContent() { loadingEl.hidden = true; contentEl.hidden = false; }

    function _lastSaturday() {
      const d = new Date();
      // JS getDay(): Sun=0, Sat=6
      const daysSinceSat = (d.getDay() + 1) % 7;  // Sat=6 → 0 ; Sun=0 → 1
      d.setDate(d.getDate() - daysSinceSat);
      const yy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}（六）23:59`;
    }

    const amountInput = document.getElementById('input-amount');
    const calcHintEl = document.getElementById('calc-hint');
    const diffHintEl = document.getElementById('diff-hint');
    let systemAmount = null;  // 後端算的系統金額（null = 取不到，不做差額比對）

    function _fmtMD(iso) {
      const [y, m, d] = iso.split('-').map(Number);
      return `${m}/${d}`;
    }

    function updateDiffHint() {
      if (systemAmount === null) { diffHintEl.textContent = ''; return; }
      const v = parseInt(amountInput.value, 10);
      if (!Number.isFinite(v) || v === systemAmount) {
        diffHintEl.textContent = '';
        return;
      }
      const diff = v - systemAmount;
      diffHintEl.textContent =
        `⚠️ 與系統計算差 ${diff > 0 ? '+' : ''}${diff.toLocaleString()}`;
    }
    amountInput.addEventListener('input', updateDiffHint);

    async function loadPrefill() {
      try {
        const resp = await fetch('/liff/accounting/weekly_payment/prefill', {
          headers: { 'Authorization': 'Bearer ' + _safeIdToken() },
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);

        systemAmount = data.total_amount;
        const range = `${_fmtMD(data.week_start)}〜${_fmtMD(data.week_end)}`;
        calcHintEl.textContent =
          `🧮 系統計算：${data.trip_count} 趟、NT$ ${data.total_amount.toLocaleString()}（${range}）`;
        if (!amountInput.value && data.total_amount > 0) {
          amountInput.value = data.total_amount;
        }
        if (data.existing_charge) {
          showAlert('err',
            `⚠️ 該週已記過扣款 NT$ ${data.existing_charge.amount.toLocaleString()}` +
            `（#${data.existing_charge.id}）。重複送出會被擋下；` +
            `金額有誤請先沖正（輸入「沖正 ${data.existing_charge.id}」）再重記。`);
        }
        updateDiffHint();
      } catch (e) {
        // 預填失敗不擋表單 — 手填照常
        calcHintEl.textContent = '（系統金額計算失敗，請手動填寫）';
        console.warn('[weekly_payment] prefill failed:', e);
      }
    }

    async function init() {
      if (!LIFF_ID) { setLoading('LIFF_ID 未設定'); return; }
      try { await liff.init({ liffId: LIFF_ID }); }
      catch (e) { setLoading('LIFF init 失敗：' + e.message); return; }
      if (!liff.isLoggedIn()) {
        // PC LIFF OAuth2 redirect_uri 必須在白名單 — 用 LIFF URL 才會通過
        liff.login({ redirectUri: 'https://liff.line.me/' + LIFF_ID + window.location.search });
        return;
      }
      lastSatEl.textContent = _lastSaturday();
      showContent();
      loadPrefill();
    }

    cancelBtn.addEventListener('click', () => {
      if (liff.isInClient && liff.isInClient()) liff.closeWindow();
      else history.back();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      submitBtn.disabled = true;
      submitBtn.textContent = '記錄中…';
      try {
        const idToken = _safeIdToken();
        const fd = new FormData(form);
        const payload = {
          amount: parseInt(fd.get('amount'), 10),
        };

        // 從 URL params 拿真實 group/room ID（liff.getContext 給的 UUID 不能用）
        const _params = new URLSearchParams(window.location.search);
        const _gid = _params.get('gid');
        const _rid = _params.get('rid');
        if (_gid) payload.source = { type: 'group', groupId: _gid, roomId: null };
        else if (_rid) payload.source = { type: 'room', groupId: null, roomId: _rid };

        const resp = await fetch('/liff/accounting/weekly_payment', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + idToken,
          },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);

        const inClient = liff.isInClient && liff.isInClient();
        if (inClient) {
          showAlert('ok', `✅ 已記錄週扣款 NT$ ${data.amount.toLocaleString()}（1.5 秒後關閉）`);
          setTimeout(() => liff.closeWindow(), 1500);
        } else {
          showAlert('ok', `✅ 已記錄週扣款 NT$ ${data.amount.toLocaleString()}`);
        }
      } catch (err) {
        showAlert('err', '❌ ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '確認扣款';
      }
    });

    init();
  </script>
</body>
</html>
