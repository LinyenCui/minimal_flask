<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>OCR 匯入批次審核</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif;
      margin: 0 auto; max-width: 920px; padding: 14px; color: #222; line-height: 1.45; font-size: 15px;
      background: #f6f7f8;
    }
    h2 { margin: 0; font-size: 21px; }
    .topbar { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; margin-bottom: 12px; }
    .run { color: #667078; font-size: 13px; word-break: break-all; }
    .panel { background: #fff; border: 1px solid #d8dde3; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
    .alert { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .alert.err { background: #fdecea; color: #b42318; border: 1px solid #f3b8b2; }
    .alert.ok { background: #e8f5e9; color: #1b6e20; border: 1px solid #b8e0bb; }
    .alert.warn { background: #fff8e1; color: #9a6700; border: 1px solid #ffd48a; }
    .alert.info { background: #eef5ff; color: #175cd3; border: 1px solid #b8d6ff; }
    .loading { text-align: center; color: #667078; padding: 44px 0; }
    .filters { display: grid; grid-template-columns: repeat(5, minmax(120px, 1fr)); gap: 8px; }
    label.field-label { display: block; font-weight: 600; color: #444; font-size: 13px; margin-bottom: 4px; }
    select, textarea, input[type=text], input[type=date] {
      width: 100%; border: 1px solid #ccd2d8; border-radius: 6px; padding: 9px 10px; font-size: 14px; background: #fff;
    }
    input:disabled { background: #f2f4f7; color: #475467; }
    textarea { min-height: 68px; resize: vertical; }
    .summary { display: grid; grid-template-columns: repeat(4, minmax(110px, 1fr)); gap: 8px; }
    .metric { border: 1px solid #dfe4ea; border-radius: 6px; padding: 8px 10px; background: #fbfcfd; }
    .metric .k { font-size: 12px; color: #667078; }
    .metric .v { font-size: 20px; font-weight: 700; margin-top: 2px; }
    .decision-list { border: 1px solid #d8dde3; border-radius: 8px; overflow: hidden; background: #fff; }
    .section-head {
      padding: 9px 12px; background: #f2f5f8; border-bottom: 1px solid #d8dde3;
      font-weight: 700; color: #344054; display: flex; justify-content: space-between; gap: 8px;
    }
    details.secondary-section summary {
      padding: 9px 12px; background: #fbfcfd; border-top: 1px solid #d8dde3; cursor: pointer;
      font-weight: 700; color: #475467;
    }
    .decision-row {
      display: grid; grid-template-columns: 32px minmax(0, 1fr) 92px; gap: 8px; align-items: start;
      padding: 10px 12px; border-bottom: 1px solid #edf0f3;
    }
    .decision-row:last-child { border-bottom: none; }
    .decision-row.disabled { opacity: 0.58; background: #fafafa; }
    .decision-row input[type=checkbox] { width: 18px; height: 18px; margin-top: 3px; }
    .line1 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .type {
      display: inline-block; min-width: 64px; text-align: center; border-radius: 5px; padding: 2px 6px;
      font-size: 12px; font-weight: 700; background: #edf2f7; color: #344054;
    }
    .value { font-weight: 700; word-break: break-word; }
    .sub { color: #667078; font-size: 12px; margin-top: 4px; word-break: break-word; }
    .evidence { color: #475467; font-size: 12px; margin-top: 6px; word-break: break-word; }
    .pill { display: inline-block; border-radius: 999px; padding: 2px 7px; background: #f2f4f7; font-size: 12px; color: #344054; }
    .result { text-align: right; font-size: 12px; color: #667078; word-break: break-word; }
    .result.success { color: #1b6e20; }
    .result.skipped { color: #9a6700; }
    .result.failed { color: #b42318; }
    .corrected-line { margin-top: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .corrected-line[hidden] { display: none; }
    .structured-customer, .structured-official-match {
      margin-top: 9px; padding: 9px; border: 1px solid #dbe4ef; border-radius: 7px; background: #f8fbff;
    }
    .structured-official-match.conflict { border-color: #ffd48a; background: #fffaf0; }
    .official-comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin: 8px 0; }
    .official-side { padding: 8px; border: 1px solid #dfe4ea; border-radius: 6px; background: #fff; font-size: 12px; word-break: break-word; }
    .official-side strong { display: block; margin-bottom: 4px; }
    .structured-grid { display: grid; grid-template-columns: repeat(3, minmax(120px, 1fr)); gap: 8px; }
    .structured-source { margin-bottom: 8px; color: #344054; font-size: 12px; word-break: break-word; }
    .identity-options { display: flex; gap: 7px 11px; flex-wrap: wrap; padding: 7px 8px; border: 1px solid #ccd2d8; border-radius: 6px; background: #fff; }
    .identity-options label { display: inline-flex; align-items: center; gap: 3px; font-size: 13px; }
    .identity-options input { width: 15px; height: 15px; margin: 0; }
    .structured-meta { margin-top: 7px; font-size: 12px; color: #667078; word-break: break-word; }
    .customer-formal {
      margin-top: 9px; padding: 9px; border: 1px solid #b8d6ff; border-radius: 7px; background: #f8fbff;
    }
    .customer-formal-actions { display: flex; gap: 7px; margin-top: 7px; flex-wrap: wrap; }
    .customer-formal-actions button { padding: 8px 10px; font-size: 13px; }
    .customer-formal-result { margin-top: 8px; font-size: 12px; color: #344054; word-break: break-word; }
    .customer-formal-result .write-row { padding: 2px 0; }
    .action-picker { display: grid; grid-template-columns: repeat(4, minmax(130px, 1fr)); gap: 8px; }
    .action-picker label {
      border: 1.5px solid #ccd2d8; border-radius: 7px; padding: 10px; background: #fff; cursor: pointer;
      display: flex; align-items: flex-start; gap: 8px; min-height: 58px;
    }
    .action-text { display: block; font-weight: 700; }
    .action-hint { display: block; color: #667078; font-size: 12px; margin-top: 2px; }
    .action-picker label.checked { border-color: #06c755; background: #e8f5e9; }
    .action-picker input { width: 16px; height: 16px; margin: 0; }
    .actions { display: flex; gap: 8px; margin-top: 12px; }
    button {
      border: 0; border-radius: 7px; padding: 11px 14px; font-size: 15px; cursor: pointer; font-weight: 650;
    }
    button.primary { background: #06c755; color: #fff; flex: 1.2; }
    button.secondary { background: #eef1f4; color: #1f2937; flex: 1; }
    button:disabled { background: #aab2bd; color: #fff; cursor: not-allowed; }
    .bulk-note { margin-top: 10px; }
    .helper { color: #667078; font-size: 12px; margin-top: 6px; }
    @media (max-width: 720px) {
      body { padding: 10px; }
      .filters, .summary, .action-picker, .corrected-line, .structured-grid, .official-comparison { grid-template-columns: 1fr; }
      .decision-row { grid-template-columns: 28px minmax(0, 1fr); }
      .result { grid-column: 2; text-align: left; }
      .actions { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="loading" class="loading">載入中...</div>

  <div id="content" hidden>
    <div class="topbar">
      <div>
        <h2>OCR 匯入批次審核</h2>
        <div class="run">run_id: <span id="run-id"></span></div>
      </div>
    </div>

    <div id="alert"></div>
    <div id="dev-skip-liff-notice" class="alert info" hidden>
      <strong>開發測試模式</strong>：已跳過 LIFF init，僅供本機畫面測試；請勿送出正式資料。
    </div>

    <div class="panel">
      <div class="alert warn">
        Drug／ICD 已先用指定官方 reference 比對；一般「送出審核」只寫 review / staging，不直接寫正式表。Relation 僅顯示 evidence，禁止 formal apply。
      </div>
      <div class="filters">
        <div>
          <label class="field-label">類型</label>
          <select id="filter-decision-type">
            <option value="all">全部</option>
            <option value="customer">customer</option>
            <option value="drug">drug</option>
            <option value="icd">icd</option>
            <option value="drug_diagnosis_link">drug_diagnosis_link</option>
          </select>
        </div>
        <div>
          <label class="field-label">建議動作</label>
          <select id="filter-suggested-action">
            <option value="all">全部</option>
            <option value="create_customer">create_customer</option>
            <option value="attach_existing_customer">attach_existing_customer</option>
            <option value="insert_drug">insert_drug</option>
            <option value="skip_drug_existing">skip_drug_existing</option>
            <option value="insert_icd">insert_icd</option>
            <option value="skip_icd_existing">skip_icd_existing</option>
            <option value="create_drug_diagnosis_link">create_drug_diagnosis_link</option>
            <option value="skip_relation_existing">skip_relation_existing</option>
            <option value="defer_relation">defer_relation</option>
            <option value="needs_review">needs_review</option>
          </select>
        </div>
        <div>
          <label class="field-label">信心</label>
          <select id="filter-confidence">
            <option value="all">全部</option>
            <option value="high">high</option>
            <option value="medium">medium</option>
            <option value="low">low</option>
            <option value="manual_review">manual_review</option>
          </select>
        </div>
        <div>
          <label class="field-label">現況</label>
          <select id="filter-existing-status">
            <option value="all">全部</option>
            <option value="exists">exists</option>
            <option value="reference_matched">reference_matched</option>
            <option value="conflict">conflict</option>
            <option value="not_found">not_found</option>
            <option value="ambiguous">ambiguous</option>
            <option value="already_linked">already_linked</option>
            <option value="not_linked">not_linked</option>
            <option value="not_applicable">not_applicable</option>
          </select>
        </div>
        <div>
          <label class="field-label">審核狀態</label>
          <select id="filter-review-decision">
            <option value="pending">pending</option>
            <option value="all">全部</option>
            <option value="approve">approve</option>
            <option value="reject">reject</option>
            <option value="skip">skip</option>
            <option value="defer">defer</option>
            <option value="corrected">corrected</option>
          </select>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="summary">
        <div class="metric"><div class="k">顯示筆數</div><div class="v" id="metric-total">0</div></div>
        <div class="metric"><div class="k">已選</div><div class="v" id="metric-selected">0</div></div>
        <div class="metric"><div class="k">預估可執行</div><div class="v" id="metric-executable">0</div></div>
        <div class="metric"><div class="k">預估跳過</div><div class="v" id="metric-skipped">0</div></div>
      </div>
    </div>

    <div class="decision-list" id="decision-list"></div>

    <form id="review-form" class="panel" novalidate>
      <label class="field-label">批次動作</label>
      <div id="action-picker" class="action-picker">
        <label>
          <input type="radio" name="action" value="approve">
          <span><span class="action-text">採用系統建議</span><span class="action-hint">內部：approve</span></span>
        </label>
        <label>
          <input type="radio" name="action" value="corrected">
          <span><span class="action-text">修正後採用</span><span class="action-hint">內部：corrected，需填修正後值</span></span>
        </label>
        <label>
          <input type="radio" name="action" value="defer">
          <span><span class="action-text">暫不處理</span><span class="action-hint">內部：defer</span></span>
        </label>
        <label>
          <input type="radio" name="action" value="not_import">
          <span><span class="action-text">不匯入</span><span class="action-hint">新資料 reject；已存在/可略過 skip</span></span>
        </label>
      </div>
      <div class="bulk-note">
        <label class="field-label">批次備註</label>
        <textarea id="review-note" placeholder="選填"></textarea>
      </div>
      <div class="helper" id="action-helper">後端會重新 validation；前端估算不代表最後結果。</div>
      <div class="actions">
        <button type="button" class="secondary" id="btn-preview" disabled>預覽 validation</button>
        <button type="submit" class="primary" id="btn-apply" disabled>送出審核</button>
      </div>
    </form>
  </div>

  <script>
    const LIFF_ID = {{ liff_id|tojson }};
    const DEFAULT_RUN_ID = {{ run_id|tojson }};
    const DEFAULT_DECISION_TYPE = {{ default_decision_type|tojson }};
    const DEFAULT_CONFIDENCE_LEVEL = {{ default_confidence_level|tojson }};
    const DEFAULT_SUGGESTED_ACTION = {{ default_suggested_action|tojson }};
    const DEFAULT_EXISTING_STATUS = {{ default_existing_status|tojson }};
    const QUERY_PARAMS = new URLSearchParams(window.location.search);
    const DEV_SKIP_LIFF = QUERY_PARAMS.get('dev_skip_liff') === '1';

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const alertEl = document.getElementById('alert');
    const devSkipLiffNoticeEl = document.getElementById('dev-skip-liff-notice');
    const listEl = document.getElementById('decision-list');
    const form = document.getElementById('review-form');
    const previewBtn = document.getElementById('btn-preview');
    const applyBtn = document.getElementById('btn-apply');
    const actionPicker = document.getElementById('action-picker');

    let items = [];
    let currentAction = '';
    let idToken = '';
    let lastPreviews = {};
    let customerFormalPreviews = {};

    function escapeHtml(value) {
      return String(value || '').replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[ch]));
    }

    function selectorEscape(value) {
      if (window.CSS && CSS.escape) return CSS.escape(value);
      return String(value || '').replace(/["\\]/g, '\\$&');
    }

    function showAlert(type, msg) {
      alertEl.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    }

    function clearAlert() { alertEl.innerHTML = ''; }

    function setLoading(text) {
      loadingEl.textContent = text;
      loadingEl.hidden = false;
      contentEl.hidden = true;
    }

    function showContent() {
      loadingEl.hidden = true;
      contentEl.hidden = false;
    }

    function safeIdToken() {
      const token = liff.getIDToken();
      if (!token) return '';
      return token.trim().replace(/[^\x21-\x7E]/g, '');
    }

    function runId() {
      return (QUERY_PARAMS.get('run_id') || DEFAULT_RUN_ID || '').trim();
    }

    function filterValue(id) {
      return document.getElementById(id).value || 'all';
    }

    function itemsUrl() {
      const params = new URLSearchParams();
      params.set('run_id', runId());
      params.set('decision_type', filterValue('filter-decision-type'));
      params.set('suggested_action', filterValue('filter-suggested-action'));
      params.set('confidence_level', filterValue('filter-confidence'));
      params.set('existing_status', filterValue('filter-existing-status'));
      params.set('review_decision', filterValue('filter-review-decision'));
      if (DEV_SKIP_LIFF) params.set('dev_skip_liff', '1');
      return '/liff/ocr-import/review/items?' + params.toString();
    }

    function apiEndpoint(path) {
      if (!DEV_SKIP_LIFF) return path;
      return path + (path.includes('?') ? '&' : '?') + 'dev_skip_liff=1';
    }

    function authHeaders(headers) {
      const result = Object.assign({}, headers || {});
      if (!DEV_SKIP_LIFF) result.Authorization = 'Bearer ' + idToken;
      return result;
    }

    async function fetchJson(url, options) {
      const resp = await fetch(url, options);
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      return data;
    }

    function selectedItems() {
      const selected = new Set();
      listEl.querySelectorAll('input[type=checkbox][data-id]:checked').forEach(cb => selected.add(cb.dataset.id));
      return items.filter(item => selected.has(item.decision_id));
    }

    function hasStructuredCustomer(item) {
      return item.decision_type === 'customer' && item.structured_fields && item.structured_fields.schema_version;
    }

    function structuredOfficialKind(item) {
      const version = ((item.structured_fields || {}).schema_version || '');
      if (item.decision_type === 'drug' && version.startsWith('prescription-drug-official-match-')) return 'drug';
      if (item.decision_type === 'icd' && version.startsWith('prescription-icd-official-match-')) return 'icd';
      return '';
    }

    function officialEffectiveValue(item, fieldName) {
      const corrected = item.structured_corrected_fields || {};
      if (Object.prototype.hasOwnProperty.call(corrected, fieldName)) return corrected[fieldName] || '';
      return (((item.structured_fields || {}).effective_fields || {})[fieldName]) || '';
    }

    function structuredValue(item, fieldName, propertyName, fallback) {
      const corrected = item.structured_corrected_fields || {};
      if (Object.prototype.hasOwnProperty.call(corrected, fieldName)) return corrected[fieldName];
      const field = (item.structured_fields || {})[propertyName || fieldName] || {};
      return field.normalized_value === undefined ? (fallback || '') : field.normalized_value;
    }

    function evidenceText(value) {
      if (!value) return '-';
      if (typeof value === 'string') return value;
      if (Array.isArray(value)) {
        return value.map(entry => typeof entry === 'string' ? entry : (entry.evidence || entry.raw_text || JSON.stringify(entry))).filter(Boolean).join(' | ') || '-';
      }
      return JSON.stringify(value);
    }

    function renderStructuredCustomer(item) {
      if (!hasStructuredCustomer(item)) return '';
      const structured = item.structured_fields || {};
      const name = structuredValue(item, 'customer_name', 'name', item.candidate_value || '');
      const shortName = structuredValue(item, 'short_name', 'short_name', name);
      const birthday = structuredValue(item, 'birthday', 'birthday', '');
      const medical = structuredValue(item, 'medical_record_no', 'medical_record_no', '');
      const gender = structuredValue(item, 'gender', 'gender', '');
      const corrected = item.structured_corrected_fields || {};
      const identityField = structured.patient_identity_markers || {};
      const markers = Array.isArray(corrected.patient_identity_markers)
        ? corrected.patient_identity_markers
        : (Array.isArray(identityField.normalized_values) ? identityField.normalized_values : []);
      const markerSet = new Set(markers);
      const markerOptions = ['榮', '榮民', '榮保', '友', '眷', '員', '重大', '殘障'];
      const sourceImages = Array.isArray(structured.source_images) && structured.source_images.length
        ? structured.source_images.join('、')
        : (item.source_image_filename || '-');
      const medicalMeta = [
        `raw=${(structured.medical_record_no || {}).raw_value || '-'}`,
        `confidence=${(structured.medical_record_no || {}).confidence || 'none'}`,
        (structured.medical_record_no || {}).warning || '',
        `evidence=${evidenceText((structured.medical_record_no || {}).evidence)}`,
      ].filter(Boolean).join('；');
      const identityMeta = [
        `raw=${evidenceText(identityField.raw_values)}`,
        `confidence=${identityField.confidence || 'none'}`,
        identityField.warning || '',
        `evidence=${evidenceText(identityField.evidence)}`,
      ].filter(Boolean).join('；');
      return `
        <div class="structured-customer">
          <div class="structured-source"><strong>來源影像：</strong>${escapeHtml(sourceImages)}</div>
          <div class="structured-grid">
            <div>
              <label class="field-label">姓名</label>
              <input type="text" class="customer-field-input" data-customer-name-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(name)}" disabled>
            </div>
            <div>
              <label class="field-label">短名</label>
              <input type="text" class="customer-field-input" data-customer-short-name-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(shortName)}" disabled>
            </div>
            <div>
              <label class="field-label">生日</label>
              <input type="date" class="customer-field-input" data-customer-birthday-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(birthday)}" disabled>
            </div>
            <div>
              <label class="field-label">病歷號</label>
              <input type="text" class="customer-field-input" data-customer-medical-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(medical)}" maxlength="20" disabled>
            </div>
            <div>
              <label class="field-label">性別</label>
              <select class="customer-field-input" data-customer-gender-id="${escapeHtml(item.decision_id)}" disabled>
                <option value="" ${gender ? '' : 'selected'}>未確認</option>
                <option value="M" ${gender === 'M' ? 'selected' : ''}>男</option>
                <option value="F" ${gender === 'F' ? 'selected' : ''}>女</option>
              </select>
            </div>
          </div>
          <div style="margin-top:8px">
            <label class="field-label">身份標記（可多選；僅 prescription review）</label>
            <div class="identity-options">
              ${markerOptions.map(marker => `<label><input type="checkbox" class="customer-field-input" data-customer-identity-id="${escapeHtml(item.decision_id)}" value="${marker}" ${markerSet.has(marker) ? 'checked' : ''} disabled>${marker}</label>`).join('')}
            </div>
          </div>
          <div class="structured-meta"><strong>病歷號 evidence：</strong>${escapeHtml(medicalMeta)}</div>
          <div class="structured-meta"><strong>身份 evidence：</strong>${escapeHtml(identityMeta)}</div>
        </div>
      `;
    }

    function renderStructuredOfficialMatch(item) {
      const kind = structuredOfficialKind(item);
      if (!kind) return '';
      const structured = item.structured_fields || {};
      const ocr = structured.ocr || {};
      const official = structured.official_match || {};
      const sourceImages = Array.isArray(structured.source_images) && structured.source_images.length
        ? structured.source_images.join('、') : (item.source_image_filename || '-');
      const matchMeta = [
        official.match_status || '-',
        official.match_basis || '-',
        `confidence=${official.confidence || 'low'}`,
        official.ambiguity || '',
        evidenceText(official.warnings),
      ].filter(Boolean).join('；');
      if (kind === 'drug') {
        return `
          <div class="structured-official-match ${official.match_status === 'conflict' ? 'conflict' : ''}">
            <div class="structured-source"><strong>來源影像：</strong>${escapeHtml(sourceImages)}</div>
            <div class="official-comparison">
              <div class="official-side"><strong>OCR</strong>
                藥名：${escapeHtml(ocr.drug_name || '-')}<br>
                健保碼：${escapeHtml(ocr.drug_code || '-')}<br>
                規格：${escapeHtml(ocr.strength || '-')}<br>
                evidence：${escapeHtml(evidenceText(ocr.evidence))}
              </div>
              <div class="official-side"><strong>官方比對</strong>
                正式藥名：${escapeHtml(official.drug_name || '-')}<br>
                正式健保碼：${escapeHtml(official.drug_code || '-')}<br>
                成分：${escapeHtml(official.ingredient || '-')}<br>
                規格：${escapeHtml(official.strength_specification || '-')}
              </div>
            </div>
            <div class="structured-meta"><strong>Match：</strong>${escapeHtml(matchMeta)}</div>
            <div class="structured-grid" style="margin-top:8px">
              <div><label class="field-label">確認／修正健保碼</label><input type="text" class="official-field-input" data-drug-code-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(officialEffectiveValue(item, 'drug_code'))}" disabled></div>
              <div><label class="field-label">確認／修正正式藥名</label><input type="text" class="official-field-input" data-drug-name-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(officialEffectiveValue(item, 'drug_name'))}" disabled></div>
              <div><label class="field-label">確認／修正成分</label><input type="text" class="official-field-input" data-drug-ingredient-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(officialEffectiveValue(item, 'ingredient'))}" disabled></div>
              <div><label class="field-label">確認／修正規格</label><input type="text" class="official-field-input" data-drug-spec-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(officialEffectiveValue(item, 'strength_specification'))}" disabled></div>
            </div>
          </div>`;
      }
      return `
        <div class="structured-official-match ${official.match_status === 'conflict' ? 'conflict' : ''}">
          <div class="structured-source"><strong>來源影像：</strong>${escapeHtml(sourceImages)}</div>
          <div class="official-comparison">
            <div class="official-side"><strong>OCR</strong>
              diagnosis：${escapeHtml(ocr.diagnosis_text || '-')}<br>
              ICD：${escapeHtml(ocr.icd_code || '-')}<br>
              normalized：${escapeHtml(ocr.normalized_icd || '-')}<br>
              evidence：${escapeHtml(evidenceText(ocr.evidence))}
            </div>
            <div class="official-side"><strong>官方比對</strong>
              official ICD：${escapeHtml(official.icd_code || '-')}<br>
              中文：${escapeHtml(official.chinese_name || '-')}<br>
              English：${escapeHtml(official.english_name || '-')}
            </div>
          </div>
          <div class="structured-meta"><strong>Match：</strong>${escapeHtml(matchMeta)}</div>
          <div class="structured-grid" style="margin-top:8px">
            <div><label class="field-label">確認／修正 ICD</label><input type="text" class="official-field-input" data-icd-code-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(officialEffectiveValue(item, 'icd_code'))}" disabled></div>
            <div><label class="field-label">確認／修正中文名稱</label><input type="text" class="official-field-input" data-icd-zh-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(officialEffectiveValue(item, 'chinese_name'))}" disabled></div>
            <div><label class="field-label">確認／修正英文名稱</label><input type="text" class="official-field-input" data-icd-en-id="${escapeHtml(item.decision_id)}" value="${escapeHtml(officialEffectiveValue(item, 'english_name'))}" disabled></div>
          </div>
        </div>`;
    }

    function renderCustomerFormalControls(item) {
      if (!['customer', 'drug', 'icd'].includes(item.decision_type) || !['approve', 'corrected'].includes(item.review_decision || '')) return '';
      return `
        <div class="customer-formal" data-customer-formal-id="${escapeHtml(item.decision_id)}">
          <strong>${escapeHtml(item.decision_type)} 正式寫入</strong>
          <div class="sub">先執行 production duplicate/conflict preview；generic /apply 只保存審核，不會繞過 formal adapter。</div>
          <div class="customer-formal-actions">
            <button type="button" class="secondary customer-formal-preview-btn" data-decision-id="${escapeHtml(item.decision_id)}">正式寫入預覽</button>
            <button type="button" class="primary customer-formal-apply-btn" data-decision-id="${escapeHtml(item.decision_id)}" hidden disabled>確認正式寫入</button>
          </div>
          <div class="customer-formal-result" data-customer-formal-result-id="${escapeHtml(item.decision_id)}">尚未產生 formal preview。</div>
        </div>
      `;
    }

    function makeIdempotencyKey() {
      if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
      return String(Date.now()) + '-' + Math.random().toString(16).slice(2);
    }

    function isSkipLikeItem(item) {
      const suggested = item.suggested_action || '';
      return suggested.startsWith('skip_') || ['exists', 'already_linked'].includes(item.existing_status || '');
    }

    function isPrimaryItem(item) {
      if (item.disabled || item.review_decision) return false;
      if (['create_customer', 'insert_drug', 'insert_icd', 'create_drug_diagnosis_link'].includes(item.suggested_action || '')) {
        return true;
      }
      if (['not_found', 'not_linked', 'ambiguous'].includes(item.existing_status || '')) return true;
      return item.suggested_action === 'needs_review';
    }

    function backendActionForItem(item, action) {
      if (action === 'not_import') return isSkipLikeItem(item) ? 'skip' : 'reject';
      return action;
    }

    function locallyExecutable(item, action) {
      if (!action || item.disabled || item.review_decision) return false;
      const backendAction = backendActionForItem(item, action);
      if (action === 'corrected') return true;
      if (backendAction === 'approve') {
        if (item.suggested_action === 'needs_review' || item.suggested_action === 'defer_relation') return false;
        if (item.existing_status === 'not_applicable') return false;
        if (item.decision_type === 'drug_diagnosis_link') {
          return ['create_drug_diagnosis_link', 'skip_relation_existing'].includes(item.suggested_action);
        }
      }
      return true;
    }

    function updateMetrics() {
      const selected = selectedItems();
      const executable = selected.filter(item => locallyExecutable(item, currentAction)).length;
      document.getElementById('metric-total').textContent = String(items.length);
      document.getElementById('metric-selected').textContent = String(selected.length);
      document.getElementById('metric-executable').textContent = String(executable);
      document.getElementById('metric-skipped').textContent = String(Math.max(0, selected.length - executable));
      previewBtn.disabled = !(selected.length && currentAction);
      applyBtn.disabled = DEV_SKIP_LIFF || !(selected.length && currentAction);
      listEl.querySelectorAll('.corrected-line').forEach(el => { el.hidden = currentAction !== 'corrected'; });
      listEl.querySelectorAll('.customer-field-input').forEach(el => {
        const row = el.closest('.decision-row');
        el.disabled = currentAction !== 'corrected' || (row && row.classList.contains('disabled'));
      });
      listEl.querySelectorAll('.official-field-input').forEach(el => {
        const row = el.closest('.decision-row');
        el.disabled = currentAction !== 'corrected' || (row && row.classList.contains('disabled'));
      });
    }

    function renderItemRow(item) {
      const disabled = item.disabled ? 'disabled' : '';
      const checked = isPrimaryItem(item) && item.confidence_level === 'high' && item.suggested_action !== 'defer_relation' && item.suggested_action !== 'needs_review' ? 'checked' : '';
      const row = document.createElement('div');
      row.className = `decision-row ${disabled}`;
      row.dataset.id = item.decision_id;
      row.innerHTML = `
        <div><input type="checkbox" data-id="${escapeHtml(item.decision_id)}" ${checked} ${disabled}></div>
        <div>
          <div class="line1">
            <span class="type">${escapeHtml(item.decision_type)}</span>
            <span class="value">${escapeHtml(item.display_name || item.candidate_value)}</span>
            <span class="pill">${escapeHtml(item.existing_status || '-')}</span>
            <span class="pill">${escapeHtml(item.suggested_action || '-')}</span>
            <span class="pill">${escapeHtml(item.confidence_level || '-')}</span>
          </div>
          <div class="sub">原始 OCR: ${escapeHtml(item.candidate_value || '-')}</div>
          <div class="sub">image: ${escapeHtml(item.source_image_filename || '-')} | candidate_id: ${escapeHtml(item.candidate_id || '-')}</div>
          <div class="evidence">${escapeHtml(item.evidence_summary || '')}</div>
          ${renderStructuredCustomer(item)}
          ${renderStructuredOfficialMatch(item)}
          ${renderCustomerFormalControls(item)}
          <div class="sub">current decision: ${escapeHtml(item.review_decision || 'pending')}</div>
          <div class="corrected-line" hidden>
            ${(hasStructuredCustomer(item) || structuredOfficialKind(item)) ? '' : `<input type="text" data-corrected-id="${escapeHtml(item.decision_id)}" placeholder="修正後值（必填）">`}
            <input type="text" data-note-id="${escapeHtml(item.decision_id)}" placeholder="review note（選填）">
          </div>
        </div>
        <div class="result" data-result-id="${escapeHtml(item.decision_id)}">${item.disabled ? escapeHtml(item.disable_reason || 'disabled') : '-'}</div>
      `;
      return row;
    }

    function appendRows(container, rows) {
      for (const item of rows) container.appendChild(renderItemRow(item));
    }

    function bindRowEvents() {
      listEl.querySelectorAll('input[type=checkbox][data-id]').forEach(cb => cb.addEventListener('change', updateMetrics));
      listEl.querySelectorAll('input[data-corrected-id]').forEach(input => input.addEventListener('input', updateMetrics));
      listEl.querySelectorAll('.customer-field-input').forEach(input => input.addEventListener('input', updateMetrics));
      listEl.querySelectorAll('.official-field-input').forEach(input => input.addEventListener('input', updateMetrics));
      listEl.querySelectorAll('.customer-formal-preview-btn').forEach(button => {
        button.addEventListener('click', () => previewCustomerFormal(button.dataset.decisionId));
      });
      listEl.querySelectorAll('.customer-formal-apply-btn').forEach(button => {
        button.addEventListener('click', () => applyCustomerFormal(button.dataset.decisionId));
      });
    }

    function renderRows() {
      if (!items.length) {
        listEl.innerHTML = '<div class="decision-row"><div></div><div class="sub">沒有符合條件的 pending 項目</div><div></div></div>';
        updateMetrics();
        return;
      }
      listEl.innerHTML = '';
      const primaryItems = items.filter(isPrimaryItem);
      const secondaryItems = items.filter(item => !isPrimaryItem(item));
      if (primaryItems.length) {
        const head = document.createElement('div');
        head.className = 'section-head';
        head.innerHTML = `<span>需要處理</span><span>${primaryItems.length} 筆</span>`;
        listEl.appendChild(head);
        appendRows(listEl, primaryItems);
      } else {
        listEl.innerHTML = '<div class="section-head"><span>需要處理</span><span>0 筆</span></div><div class="decision-row"><div></div><div class="sub">目前沒有新客戶、新藥品、新 ICD 或尚未建立的藥診關聯</div><div></div></div>';
      }
      if (secondaryItems.length) {
        const details = document.createElement('details');
        details.className = 'secondary-section';
        const processedCount = secondaryItems.filter(item => item.review_decision).length;
        const formalReadyCount = secondaryItems.filter(item =>
          ['customer', 'drug', 'icd'].includes(item.decision_type)
          && ['approve', 'corrected'].includes(item.review_decision || '')
        ).length;
        const label = formalReadyCount
          ? `已確認，待 formal preview / apply ${formalReadyCount} 筆（本區共 ${secondaryItems.length} 筆）`
          : (processedCount ? `已處理 / 已存在 / 可略過 ${secondaryItems.length} 筆` : `已存在 / 可略過 ${secondaryItems.length} 筆`);
        details.innerHTML = `<summary>${label}</summary>`;
        details.open = formalReadyCount > 0;
        const body = document.createElement('div');
        appendRows(body, secondaryItems);
        details.appendChild(body);
        listEl.appendChild(details);
      }
      bindRowEvents();
      updateMetrics();
    }

    async function loadItems() {
      clearAlert();
      lastPreviews = {};
      customerFormalPreviews = {};
      if (!runId()) {
        setLoading('URL 缺 run_id');
        return;
      }
      document.getElementById('run-id').textContent = runId();
      const data = await fetchJson(itemsUrl(), {
        headers: authHeaders(),
      });
      items = data.items || [];
      renderRows();
      showContent();
    }

    function renderCustomerFormalPreview(decisionId, data) {
      const resultEl = listEl.querySelector(`[data-customer-formal-result-id="${selectorEscape(decisionId)}"]`);
      const applyEl = listEl.querySelector(`.customer-formal-apply-btn[data-decision-id="${selectorEscape(decisionId)}"]`);
      if (!resultEl || !applyEl) return;
      const plan = data.plan || {};
      const fields = plan.write_fields || {};
      const identity = data.patient_identity || {};
      const duplicateMatches = ((data.duplicate_check || {}).matches) || plan.duplicate_check || {};
      const duplicateSummary = Object.entries(duplicateMatches)
        .map(([key, rows]) => `${key}=${Array.isArray(rows) ? rows.length : 0}`)
        .join('；');
      const fieldRows = Object.entries(fields).length
        ? Object.entries(fields).map(([key, value]) => `<div class="write-row"><strong>${escapeHtml(key)}</strong>：${escapeHtml(value === null ? 'NULL' : value)}</div>`).join('')
        : '<div class="write-row">無自動寫入欄位</div>';
      resultEl.innerHTML = `
        <div><strong>判定：</strong>${escapeHtml(plan.status || '-')}</div>
        <div><strong>正式 service：</strong>${escapeHtml(plan.formal_tool || '-')}</div>
        <div><strong>target：</strong>${escapeHtml(data.target_table || '-')} #${escapeHtml(plan.target_customer_id || plan.target_id || '-')}</div>
        <div style="margin-top:5px"><strong>預計寫入：</strong>${fieldRows}</div>
        <div style="margin-top:5px"><strong>Duplicate checks：</strong>${escapeHtml(duplicateSummary || '-')}</div>
        ${data.formal_kind === 'customer' ? `<div style="margin-top:5px"><strong>Identity：</strong>${escapeHtml((identity.markers || []).join('、') || '無')}；review-only，不寫 customers / remarks / relation。</div>` : ''}
        <div><strong>Reference discrepancy：</strong>${escapeHtml((((data.candidate || {}).reference_discrepancies) || []).join('、') || '無')}</div>
        <div><strong>Hard-excluded：</strong>${escapeHtml((data.hard_excluded_fields || plan.hard_excluded_fields || []).join('、'))}</div>
      `;
      const ready = ['ready_for_create', 'ready_for_update'].includes(plan.status || '');
      applyEl.hidden = !ready;
      applyEl.disabled = DEV_SKIP_LIFF || !ready;
      if (DEV_SKIP_LIFF && ready) applyEl.textContent = '開發模式禁止正式寫入';
    }

    async function previewCustomerFormal(decisionId) {
      clearAlert();
      const button = listEl.querySelector(`.customer-formal-preview-btn[data-decision-id="${selectorEscape(decisionId)}"]`);
      if (button) button.disabled = true;
      try {
        const data = await fetchJson(apiEndpoint('/liff/ocr-import/review/formal/preview'), {
          method: 'POST',
          headers: authHeaders({'Content-Type': 'application/json'}),
          body: JSON.stringify({run_id: runId(), decision_id: decisionId, dev_skip_liff: DEV_SKIP_LIFF ? '1' : ''}),
        });
        customerFormalPreviews[decisionId] = {
          formal_preview_id: data.formal_preview_id || '',
          formal_preview_result_hash: data.formal_preview_result_hash || '',
          formal_kind: data.formal_kind || '',
          target_table: data.target_table || '',
        };
        renderCustomerFormalPreview(decisionId, data);
        showAlert(['ready_for_create', 'ready_for_update'].includes((data.plan || {}).status) ? 'ok' : 'warn', `${data.formal_kind || 'formal'} preview：${(data.plan || {}).status || '-'}`);
      } catch (e) {
        showAlert('err', e.message);
      } finally {
        if (button) button.disabled = false;
      }
    }

    async function applyCustomerFormal(decisionId) {
      if (DEV_SKIP_LIFF) {
        showAlert('err', '開發測試模式不允許 formal apply。');
        return;
      }
      const preview = customerFormalPreviews[decisionId];
      if (!preview || !preview.formal_preview_id || !preview.formal_preview_result_hash) {
        showAlert('err', '請先執行目前 row 的正式寫入預覽。');
        return;
      }
      const identityNotice = preview.formal_kind === 'customer' ? ' Identity 不會寫入。' : ' Relation 不會寫入。';
      if (!window.confirm(`確認依目前 preview 正式寫入 ${preview.target_table || preview.formal_kind}？${identityNotice}`)) return;
      const button = listEl.querySelector(`.customer-formal-apply-btn[data-decision-id="${selectorEscape(decisionId)}"]`);
      if (button) button.disabled = true;
      try {
        const data = await fetchJson('/liff/ocr-import/review/formal/apply', {
          method: 'POST',
          headers: authHeaders({'Content-Type': 'application/json'}),
          body: JSON.stringify({
            run_id: runId(),
            decision_id: decisionId,
            formal_preview_id: preview.formal_preview_id,
            formal_preview_result_hash: preview.formal_preview_result_hash,
          }),
        });
        showAlert('ok', `${data.target_table || data.formal_kind} #${data.target_id || data.customer_id} 已完成 ${data.formal_action || 'formal apply'}。`);
        const resultEl = listEl.querySelector(`[data-customer-formal-result-id="${selectorEscape(decisionId)}"]`);
        if (resultEl) resultEl.innerHTML += `<div class="alert ok" style="margin-top:8px">已 commit ${escapeHtml(data.target_table || data.formal_kind)} #${escapeHtml(data.target_id || data.customer_id)}</div>`;
        customerFormalPreviews[decisionId] = null;
        if (button) button.hidden = true;
      } catch (e) {
        showAlert('err', e.message);
        if (button) button.disabled = false;
      }
    }

    function collectPayload(action, selected, previewMeta) {
      const corrected = {};
      for (const item of selected) {
        const valueEl = listEl.querySelector(`input[data-corrected-id="${selectorEscape(item.decision_id)}"]`);
        const noteEl = listEl.querySelector(`input[data-note-id="${selectorEscape(item.decision_id)}"]`);
        let structuredFields = null;
        let correctedValue = valueEl ? valueEl.value.trim() : '';
        if (hasStructuredCustomer(item)) {
          const nameEl = listEl.querySelector(`input[data-customer-name-id="${selectorEscape(item.decision_id)}"]`);
          const shortNameEl = listEl.querySelector(`input[data-customer-short-name-id="${selectorEscape(item.decision_id)}"]`);
          const birthdayEl = listEl.querySelector(`input[data-customer-birthday-id="${selectorEscape(item.decision_id)}"]`);
          const medicalEl = listEl.querySelector(`input[data-customer-medical-id="${selectorEscape(item.decision_id)}"]`);
          const genderEl = listEl.querySelector(`select[data-customer-gender-id="${selectorEscape(item.decision_id)}"]`);
          const identityEls = listEl.querySelectorAll(`input[data-customer-identity-id="${selectorEscape(item.decision_id)}"]:checked`);
          correctedValue = nameEl ? nameEl.value.trim() : '';
          structuredFields = {
            customer_name: correctedValue,
            short_name: shortNameEl ? shortNameEl.value.trim() : correctedValue,
            birthday: birthdayEl ? birthdayEl.value.trim() : '',
            medical_record_no: medicalEl ? medicalEl.value.trim() : '',
            gender: genderEl ? genderEl.value.trim() : '',
            patient_identity_markers: Array.from(identityEls).map(el => el.value),
          };
        } else if (structuredOfficialKind(item) === 'drug') {
          const codeEl = listEl.querySelector(`input[data-drug-code-id="${selectorEscape(item.decision_id)}"]`);
          const nameEl = listEl.querySelector(`input[data-drug-name-id="${selectorEscape(item.decision_id)}"]`);
          const ingredientEl = listEl.querySelector(`input[data-drug-ingredient-id="${selectorEscape(item.decision_id)}"]`);
          const specEl = listEl.querySelector(`input[data-drug-spec-id="${selectorEscape(item.decision_id)}"]`);
          correctedValue = codeEl ? codeEl.value.trim() : '';
          structuredFields = {
            drug_code: correctedValue,
            drug_name: nameEl ? nameEl.value.trim() : '',
            ingredient: ingredientEl ? ingredientEl.value.trim() : '',
            strength_specification: specEl ? specEl.value.trim() : '',
          };
        } else if (structuredOfficialKind(item) === 'icd') {
          const codeEl = listEl.querySelector(`input[data-icd-code-id="${selectorEscape(item.decision_id)}"]`);
          const zhEl = listEl.querySelector(`input[data-icd-zh-id="${selectorEscape(item.decision_id)}"]`);
          const enEl = listEl.querySelector(`input[data-icd-en-id="${selectorEscape(item.decision_id)}"]`);
          correctedValue = codeEl ? codeEl.value.trim() : '';
          structuredFields = {
            icd_code: correctedValue,
            chinese_name: zhEl ? zhEl.value.trim() : '',
            english_name: enEl ? enEl.value.trim() : '',
          };
        }
        corrected[item.decision_id] = {
          corrected_value: correctedValue,
          review_note: noteEl ? noteEl.value.trim() : '',
        };
        if (structuredFields) corrected[item.decision_id].structured_fields = structuredFields;
      }
      const payload = {
        run_id: runId(),
        requested_action: action,
        decision_items: selected.map(item => ({
          decision_id: item.decision_id,
          row_number: item.row_number,
          decision_type: item.decision_type,
          candidate_id: item.candidate_id,
          expected_review_decision: item.review_decision || '',
        })),
        corrected_values: corrected,
        review_note: document.getElementById('review-note').value.trim(),
        idempotency_key: previewMeta && previewMeta.idempotency_key ? previewMeta.idempotency_key : makeIdempotencyKey(),
        dev_skip_liff: DEV_SKIP_LIFF ? '1' : '',
      };
      if (previewMeta) {
        payload.preview_id = previewMeta.preview_id || '';
        payload.queue_revision = previewMeta.queue_revision || null;
        payload.selected_rows_hash = previewMeta.selected_rows_hash || '';
        payload.preview_result_hash = previewMeta.preview_result_hash || '';
        payload.accept_skipped = !!previewMeta.accept_skipped;
      }
      return payload;
    }

    function actionGroupsForSelection(selected) {
      if (currentAction !== 'not_import') {
        return [{ action: currentAction, items: selected }];
      }
      const skipItems = selected.filter(isSkipLikeItem);
      const rejectItems = selected.filter(item => !isSkipLikeItem(item));
      return [
        { action: 'reject', items: rejectItems },
        { action: 'skip', items: skipItems },
      ].filter(group => group.items.length);
    }

    function groupSignature(action, selected) {
      return action + '|' + selected.map(item => item.decision_id).sort().join('|');
    }

    function combineResults(responses) {
      return {
        ok: responses.every(resp => resp.ok !== false),
        success_count: responses.reduce((sum, resp) => sum + (resp.success_count || 0), 0),
        skipped_count: responses.reduce((sum, resp) => sum + (resp.skipped_count || 0), 0),
        failed_count: responses.reduce((sum, resp) => sum + (resp.failed_count || 0), 0),
        per_item_result: responses.flatMap(resp => resp.per_item_result || []),
        formal_tables_touched: responses.every(resp => resp.formal_tables_touched === 'none') ? 'none' : 'review_required',
      };
    }

    function validateCorrectedValues(selected) {
      if (currentAction !== 'corrected') return true;
      for (const item of selected) {
        if (hasStructuredCustomer(item)) {
          const nameEl = listEl.querySelector(`input[data-customer-name-id="${selectorEscape(item.decision_id)}"]`);
          const shortNameEl = listEl.querySelector(`input[data-customer-short-name-id="${selectorEscape(item.decision_id)}"]`);
          const medicalEl = listEl.querySelector(`input[data-customer-medical-id="${selectorEscape(item.decision_id)}"]`);
          if (!nameEl || !nameEl.value.trim()) {
            showAlert('err', '修正 customer 時，姓名不可空白。');
            if (nameEl) nameEl.focus();
            return false;
          }
          if (!shortNameEl || !shortNameEl.value.trim()) {
            showAlert('err', '修正 customer 時，短名不可空白。');
            if (shortNameEl) shortNameEl.focus();
            return false;
          }
          const medical = medicalEl ? medicalEl.value.trim() : '';
          if (medical && !/^[A-Za-z0-9][A-Za-z0-9-]{0,19}$/.test(medical)) {
            showAlert('err', '病歷號只能包含英數字與連字號，最長 20 字。');
            if (medicalEl) medicalEl.focus();
            return false;
          }
          continue;
        }
        if (structuredOfficialKind(item) === 'drug') {
          const codeEl = listEl.querySelector(`input[data-drug-code-id="${selectorEscape(item.decision_id)}"]`);
          const nameEl = listEl.querySelector(`input[data-drug-name-id="${selectorEscape(item.decision_id)}"]`);
          if (!codeEl || !/^[A-Za-z0-9]{8,13}$/.test(codeEl.value.trim()) || !nameEl || !nameEl.value.trim()) {
            showAlert('err', '修正 Drug 時，必須填寫有效健保碼與正式藥名。');
            if (codeEl) codeEl.focus();
            return false;
          }
          continue;
        }
        if (structuredOfficialKind(item) === 'icd') {
          const codeEl = listEl.querySelector(`input[data-icd-code-id="${selectorEscape(item.decision_id)}"]`);
          const zhEl = listEl.querySelector(`input[data-icd-zh-id="${selectorEscape(item.decision_id)}"]`);
          if (!codeEl || !/^[A-TV-Za-tv-z][0-9]{2}(?:\.?[0-9A-Za-z]{1,4})?$/.test(codeEl.value.trim()) || !zhEl || !zhEl.value.trim()) {
            showAlert('err', '修正 ICD 時，必須填寫有效 ICD 與中文名稱。');
            if (codeEl) codeEl.focus();
            return false;
          }
          continue;
        }
        const valueEl = listEl.querySelector(`input[data-corrected-id="${selectorEscape(item.decision_id)}"]`);
        if (!valueEl || !valueEl.value.trim()) {
          showAlert('err', '修正後採用時，每筆都必須填寫修正後值。');
          if (valueEl) valueEl.focus();
          return false;
        }
      }
      return true;
    }

    function renderResults(data) {
      for (const result of data.per_item_result || []) {
        const el = listEl.querySelector(`.result[data-result-id="${selectorEscape(result.decision_id || '')}"]`);
        if (!el) continue;
        el.className = 'result ' + (result.result || '');
        el.textContent = `${result.result || '-'}: ${result.reason || ''}`;
      }
      const msg = `success ${data.success_count || 0} / skipped ${data.skipped_count || 0} / failed ${data.failed_count || 0}`;
      showAlert((data.failed_count || 0) ? 'warn' : 'ok', msg);
    }

    async function submitReview(dryRun) {
      clearAlert();
      if (!currentAction) {
        showAlert('err', '請先選擇批次動作');
        return;
      }
      const selected = selectedItems();
      if (!selected.length) {
        showAlert('err', '請先勾選項目');
        return;
      }
      if (DEV_SKIP_LIFF && !dryRun) {
        showAlert('err', '開發測試模式不允許送出審核，請只使用預覽 validation。');
        return;
      }
      const endpoint = dryRun ? '/liff/ocr-import/review/preview' : '/liff/ocr-import/review/apply';
      if (!validateCorrectedValues(selected)) return;
      const groups = actionGroupsForSelection(selected);
      previewBtn.disabled = true;
      applyBtn.disabled = true;
      try {
        const responses = [];
        for (const group of groups) {
          const signature = groupSignature(group.action, group.items);
          let previewMeta = null;
          if (!dryRun) {
            previewMeta = lastPreviews[signature];
            if (!previewMeta) {
              throw new Error('請先對目前勾選項目執行預覽 validation，預覽成功後才能送出審核。');
            }
          }
          const payload = collectPayload(group.action, group.items, previewMeta);
          const data = await fetchJson(apiEndpoint(endpoint), {
            method: 'POST',
            headers: authHeaders({
              'Content-Type': 'application/json',
            }),
            body: JSON.stringify(payload),
          });
          if (dryRun) {
            lastPreviews[signature] = {
              idempotency_key: payload.idempotency_key,
              preview_id: data.preview_id || '',
              queue_revision: data.queue_revision || null,
              selected_rows_hash: data.selected_rows_hash || '',
              preview_result_hash: data.preview_result_hash || '',
              accept_skipped: false,
              failed_count: data.failed_count || 0,
              skipped_count: data.skipped_count || 0,
            };
          }
          responses.push(data);
        }
        const data = combineResults(responses);
        renderResults(data);
        if (!dryRun && !(data.failed_count || 0)) {
          const msg = `success ${data.success_count || 0} / skipped ${data.skipped_count || 0} / failed ${data.failed_count || 0}`;
          document.getElementById('filter-review-decision').value = 'all';
          lastPreviews = {};
          await loadItems();
          showAlert('ok', msg);
        }
      } catch (e) {
        showAlert('err', e.message);
      } finally {
        updateMetrics();
      }
    }

    actionPicker.querySelectorAll('input[type=radio]').forEach(radio => {
      radio.addEventListener('change', () => {
        currentAction = radio.value;
        actionPicker.querySelectorAll('label').forEach(label => label.classList.remove('checked'));
        radio.closest('label').classList.add('checked');
        updateMetrics();
      });
    });

    ['filter-decision-type', 'filter-suggested-action', 'filter-confidence', 'filter-existing-status', 'filter-review-decision'].forEach(id => {
      document.getElementById(id).addEventListener('change', () => loadItems().catch(e => showAlert('err', e.message)));
    });

    previewBtn.addEventListener('click', () => submitReview(true));
    form.addEventListener('submit', e => {
      e.preventDefault();
      submitReview(false);
    });

    async function init() {
      document.getElementById('filter-decision-type').value = DEFAULT_DECISION_TYPE || 'all';
      document.getElementById('filter-confidence').value = DEFAULT_CONFIDENCE_LEVEL || 'all';
      document.getElementById('filter-suggested-action').value = DEFAULT_SUGGESTED_ACTION || 'all';
      document.getElementById('filter-existing-status').value = DEFAULT_EXISTING_STATUS || 'all';
      if (DEV_SKIP_LIFF) {
        if (devSkipLiffNoticeEl) devSkipLiffNoticeEl.hidden = false;
        applyBtn.textContent = '開發模式停用送出';
        await loadItems();
        return;
      }
      if (!LIFF_ID) { setLoading('LIFF_ID 未設定'); return; }
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (e) {
        setLoading('LIFF init 失敗: ' + e.message);
        return;
      }
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: 'https://liff.line.me/' + LIFF_ID + window.location.search });
        return;
      }
      idToken = safeIdToken();
      if (!idToken) { setLoading('LIFF idToken 取得失敗，請重新打開頁面'); return; }
      await loadItems();
    }

    init().catch(e => setLoading(e.message));
  </script>
</body>
