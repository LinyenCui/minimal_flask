<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>客戶資料</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 16px; line-height: 1.5; color: #222; max-width: 600px; margin: 0 auto; font-size: 16px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; color: #444; }
    .field .req { color: #c0392b; margin-left: 2px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc;
      border-radius: 6px; background: #fff;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #06c755; }
    .field textarea { resize: vertical; min-height: 60px; }
    .radio-row { display: flex; gap: 16px; padding: 6px 0; }
    .radio-row label { font-weight: normal; display: inline-flex; align-items: center; gap: 6px; }
    .radio-row input[type=radio] { width: auto; }
    .actions { margin-top: 24px; display: flex; gap: 8px; }
    /* .actions 是 display:flex，會蓋過 [hidden] 的 display:none，
       需更高特異性的規則，hidden 時才真的收起（比照 booking form） */
    .actions[hidden] { display: none; }
    button { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: 0; cursor: pointer; }
    button[type=submit] { background: #06c755; color: #fff; font-weight: 600; }
    button[type=submit]:disabled { background: #aaa; }
    button.secondary { background: #f3f3f3; color: #333; }
    button.primary { background: #06c755; color: #fff; font-weight: 600; }
    .alert { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .alert.err { background: #fdecea; color: #c0392b; border: 1px solid #f5c2bf; }
    .alert.ok { background: #e8f5e9; color: #1a7a1a; border: 1px solid #b8e0bb; }
    .loading { text-align: center; color: #666; padding: 40px 0; }
    fieldset { border: 0; padding: 0; margin: 0; }
    details { margin-bottom: 14px; border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; }
    details summary { font-weight: 600; cursor: pointer; padding: 4px 0; color: #555; }
    details[open] { background: #fafafa; }
    /* 多筆客戶卡（新增模式） */
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 16px; background: #fff; }
    .card-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-head[hidden] { display: none; }
    .card-title { font-weight: 700; color: #333; }
    .card-remove { flex: 0 0 auto; background: #fdecea; color: #c0392b; border: 0; border-radius: 6px; padding: 6px 10px; font-size: 14px; cursor: pointer; }
    .card-err { background: #fdecea; color: #c0392b; border: 1px solid #f5c2bf; border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; font-size: 14px; }
    .card-err[hidden] { display: none; }
    /* 提交後逐筆結果 */
    .result-list { border: 1px solid #eee; border-radius: 6px; padding: 10px 12px; margin-bottom: 12px; }
    .result-line { padding: 4px 0; font-size: 15px; }
    .result-line.ok { color: #1a7a1a; }
    .result-line.err { color: #c0392b; }
  </style>
</head>
<body>
  <div id="loading" class="loading">載入中…</div>
  <div id="content" hidden>
    <h2 id="form-title">客戶資料</h2>
    <div id="alert"></div>
    <div id="results" hidden></div>
    <form id="customer-form" novalidate>
      <div id="cards"></div>
      <div class="actions" id="add-actions" hidden>
        <button type="button" class="secondary" id="btn-add">＋ 再新增一位</button>
      </div>
      <div class="actions">
        <button type="button" class="secondary" id="btn-cancel">取消</button>
        <button type="submit" id="btn-submit">儲存</button>
      </div>
    </form>

    <div id="post-actions" class="actions" hidden>
      <button type="button" class="secondary" id="btn-done">✅ 完成關閉</button>
      <button type="button" class="primary" id="btn-again">✏️ 再新增一位</button>
    </div>
  </div>

  <!-- 一組客戶欄位卡（新增模式可複製多張；編輯模式只用一張） -->
  <template id="card-tpl">
    <div class="card">
      <div class="card-head" hidden>
        <span class="card-title">客戶</span>
        <button type="button" class="card-remove">✕ 移除</button>
      </div>
      <div class="card-err" hidden></div>
      <div class="field">
        <label>姓名<span class="req">*</span></label>
        <input data-field="name" type="text" required maxlength="100">
      </div>
      <div class="field">
        <label>簡稱<span class="req">*</span><small style="font-weight:normal;color:#888;">（唯一）</small></label>
        <input data-field="short_name" type="text" required maxlength="50">
      </div>
      <div class="field">
        <label>地址<span class="req">*</span></label>
        <input data-field="address" type="text" required maxlength="200">
      </div>
      <div class="field">
        <label>類別<span class="req">*</span></label>
        <select data-field="category" required>
          <option value="">（請選擇）</option>
          <option value="診所">診所</option>
          <option value="東洋">東洋</option>
          <option value="臨時">臨時</option>
        </select>
      </div>
      <div class="field">
        <label>聯絡電話</label>
        <input data-field="contact_phone" type="tel" maxlength="20" placeholder="例：0912-345-678">
      </div>
      <div class="field">
        <label>備註</label>
        <textarea data-field="remarks" rows="3" maxlength="500" placeholder="（自費、特殊情況、注意事項…）"></textarea>
      </div>

      <details>
        <summary>填寫更多資料（生日 / 性別 / 病歷號 / 共照網代號）</summary>
        <div class="field" style="margin-top: 10px;">
          <label>生日</label>
          <input data-field="birthday" type="date">
        </div>
        <div class="field">
          <label>性別</label>
          <fieldset class="radio-row">
            <label><input type="radio" data-field="gender" value="" checked>不填</label>
            <label><input type="radio" data-field="gender" value="M">男</label>
            <label><input type="radio" data-field="gender" value="F">女</label>
          </fieldset>
        </div>
        <div class="field">
          <label>病歷號</label>
          <input data-field="medical_record_no" type="text" maxlength="50">
        </div>
        <div class="field">
          <label>糖尿病共照網代號</label>
          <input data-field="dm_care_no" type="text" maxlength="10" inputmode="numeric" placeholder="診所內部編號（約 4 位數，可留空）">
        </div>
      </details>
    </div>
  </template>

  <script>
    const LIFF_ID = "{{ liff_id }}";
    const SERVER_CUSTOMER_ID = {{ customer_id|tojson }};

    // LIFF URL 帶 ?customer_id=N 進編輯模式（手機從 Flex 編輯按鈕進來時）
    function _readQueryCustomerId() {
      const params = new URLSearchParams(window.location.search);
      let cid = params.get('customer_id');
      if (cid) return parseInt(cid, 10) || null;
      // LIFF 有時把 query 包進 ?liff.state=...
      const ls = params.get('liff.state');
      if (ls) {
        const stripped = ls.startsWith('?') ? ls.slice(1) : ls;
        cid = new URLSearchParams(stripped).get('customer_id');
        if (cid) return parseInt(cid, 10) || null;
      }
      return null;
    }
    const CUSTOMER_ID = SERVER_CUSTOMER_ID || _readQueryCustomerId();
    const MODE = CUSTOMER_ID ? 'edit' : 'create';

    // 讀 webhook 給的 group/room ID（包進 ?gid= / ?rid=，可能在 liff.state 裡也可能展開後）
    // LIFF SDK 的 liff.getContext().groupId 是 UUID（≠ LINE 平台 ID），不能拿來 push，
    // 所以 bot 在 webhook 階段塞進 LIFF URL，這裡讀回來
    function _readSource() {
      function _scan(qs) {
        const p = new URLSearchParams(qs);
        const g = p.get('gid'), r = p.get('rid');
        if (g) return { type: 'group', groupId: g, roomId: null };
        if (r) return { type: 'room', groupId: null, roomId: r };
        return null;
      }
      let s = _scan(window.location.search);
      if (s) return s;
      const ls = new URLSearchParams(window.location.search).get('liff.state');
      if (ls) {
        const stripped = ls.startsWith('?') ? ls.slice(1) : ls;
        s = _scan(stripped);
      }
      return s;
    }

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const titleEl = document.getElementById('form-title');
    const alertEl = document.getElementById('alert');
    const resultsEl = document.getElementById('results');
    const form = document.getElementById('customer-form');
    const cardsEl = document.getElementById('cards');
    const cardTpl = document.getElementById('card-tpl');
    const addActions = document.getElementById('add-actions');
    const addBtn = document.getElementById('btn-add');
    const submitBtn = document.getElementById('btn-submit');
    const cancelBtn = document.getElementById('btn-cancel');
    const postActions = document.getElementById('post-actions');
    const doneBtn = document.getElementById('btn-done');
    const againBtn = document.getElementById('btn-again');

    function showAlert(type, msg) {
      alertEl.innerHTML = `<div class="alert ${type}">${msg}</div>`;
    }

    function clearAlert() { alertEl.innerHTML = ''; }

    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g,
        m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));
    }

    // 防 LIFF SDK 偶爾回傳含 \r \n \0 的 idToken 導致 Headers.set 炸
    // (iOS Safari WebView 上常見「The string did not match the expected pattern.」)
    function _safeIdToken() {
      const t = liff.getIDToken();
      if (!t) {
        console.warn('[_safeIdToken] getIDToken returned falsy:', t);
        return '';
      }
      // 先 trim 兩邊空白，再 strip 所有非「ASCII printable」字元（0x21-0x7E）
      // JWT idToken 應該只含 [A-Za-z0-9_\-\.]，任何非該範圍都不該保留
      const cleaned = t.trim().replace(/[^\x21-\x7E]/g, '');
      if (cleaned.length !== t.length) {
        const codes = Array.from(t.slice(0, 30))
          .map(c => c.charCodeAt(0).toString(16))
          .join(' ');
        console.warn(
          `[_safeIdToken] cleaned ${t.length - cleaned.length} bad chars; ` +
          `original len=${t.length}, clean len=${cleaned.length}, ` +
          `first 30 hex: ${codes}`
        );
      }
      return cleaned;
    }

    function setLoading(text) { loadingEl.textContent = text; loadingEl.hidden = false; contentEl.hidden = true; }
    function showContent() { loadingEl.hidden = true; contentEl.hidden = false; }

    // ---------- 多筆客戶卡管理 ----------

    let cardSeq = 0;

    function cards() { return Array.from(cardsEl.querySelectorAll('.card')); }

    // 卡片標頭（客戶 1 / 2 / …＋移除鈕）只在新增模式且 >1 張時顯示
    function refreshCardHeads() {
      const all = cards();
      all.forEach((c, i) => {
        c.querySelector('.card-head').hidden = (MODE === 'edit') || all.length === 1;
        c.querySelector('.card-title').textContent = `客戶 ${i + 1}`;
      });
    }

    function addCard() {
      const frag = cardTpl.content.cloneNode(true);
      const card = frag.querySelector('.card');
      const seq = ++cardSeq;
      // radio group 每張卡要有獨立 name，才不會跨卡互斥
      card.querySelectorAll('input[type=radio][data-field="gender"]').forEach(r => {
        r.name = 'gender_' + seq;
      });
      card.querySelector('.card-remove').addEventListener('click', () => {
        card.remove();
        refreshCardHeads();
      });
      // 使用者修改內容 → 收掉這張卡上一輪的失敗紅字
      card.addEventListener('input', () => {
        const errEl = card.querySelector('.card-err');
        if (errEl) errEl.hidden = true;
      }, true);
      cardsEl.appendChild(frag);
      refreshCardHeads();
      return card;
    }

    function collectCard(card) {
      const obj = {};
      card.querySelectorAll('[data-field]').forEach(el => {
        const k = el.dataset.field;
        if (el.type === 'radio') {
          if (el.checked) obj[k] = el.value;
        } else {
          obj[k] = el.value;
        }
      });
      return obj;
    }

    // 編輯模式 prefill：填值＋進階欄位有資料就展開 details
    function fillCard(card, c) {
      card.querySelectorAll('[data-field]').forEach(el => {
        const k = el.dataset.field;
        if (el.type === 'radio') {
          el.checked = (el.value === (c.gender ?? ''));
        } else if (k in c) {
          el.value = c[k] ?? '';
        }
      });
      const det = card.querySelector('details');
      if (det && (c.birthday || c.gender || c.medical_record_no || c.dm_care_no)) {
        det.open = true;
      }
    }

    async function loadCustomer(id) {
      const idToken = _safeIdToken();
      const resp = await fetch(`/liff/customer/${id}`, {
        headers: { 'Authorization': 'Bearer ' + idToken },
      });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      return data.customer;
    }

    async function init() {
      if (!LIFF_ID) { setLoading('LIFF_ID 未設定'); return; }
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (e) {
        setLoading('LIFF init 失敗：' + e.message);
        return;
      }
      if (!liff.isLoggedIn()) {
        // PC LIFF 走 OAuth2 時 redirect_uri 必須在 Callback URL 白名單裡，
        // 用 LIFF URL（liff.line.me/{id}）才會通過 — 手機不走 OAuth2 不受影響。
        // window.location.search 把當前 query 帶過去，回來時 dispatcher 才能路由。
        liff.login({ redirectUri: 'https://liff.line.me/' + LIFF_ID + window.location.search });
        return;
      }
      titleEl.textContent = MODE === 'edit' ? `編輯客戶 #${CUSTOMER_ID}` : '新增客戶';
      const firstCard = addCard();
      if (MODE === 'edit') {
        try {
          const c = await loadCustomer(CUSTOMER_ID);
          fillCard(firstCard, c);
        } catch (e) {
          setLoading('載入客戶資料失敗：' + e.message);
          return;
        }
      } else {
        // 新增模式才有「＋ 再新增一位」；編輯維持單筆
        addActions.hidden = false;
      }
      showContent();
    }

    function _closeOrBack() {
      if (liff.isInClient && liff.isInClient()) liff.closeWindow();
      else history.back();
    }

    cancelBtn.addEventListener('click', _closeOrBack);
    doneBtn.addEventListener('click', () => { doneBtn.disabled = true; _closeOrBack(); });

    addBtn.addEventListener('click', () => {
      const card = addCard();
      card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      const nameEl = card.querySelector('[data-field="name"]');
      if (nameEl && nameEl.focus) nameEl.focus();
    });

    // 完成後「再新增一位」：清結果、重開一張空白卡
    againBtn.addEventListener('click', () => {
      clearAlert();
      resultsEl.hidden = true;
      resultsEl.innerHTML = '';
      cards().forEach(c => c.remove());
      addCard();
      form.hidden = false;
      postActions.hidden = true;
      submitBtn.disabled = false;
      submitBtn.textContent = '儲存';
      window.scrollTo(0, 0);
    });

    // 逐筆結果（成功打勾、失敗紅字原因）
    function renderResults(results) {
      const lines = results.map(r => r.ok
        ? `<div class="result-line ok">✅ #${r.customer.id} ${esc(r.label)}</div>`
        : `<div class="result-line err">❌ ${esc(r.label)}：${esc(r.error || '新增失敗')}</div>`
      ).join('');
      resultsEl.innerHTML = `<div class="result-list">${lines}</div>`;
      resultsEl.hidden = false;
    }

    // 新增模式提交後處理：成功卡移除；失敗卡留在表單上帶紅字原因，可修正重送
    function handleBatchResults(results, submittedCards) {
      results.forEach((r, i) => {
        const card = submittedCards[i];
        if (!card) return;
        if (r.ok) {
          card.remove();
        } else {
          const errEl = card.querySelector('.card-err');
          errEl.textContent = '❌ ' + (r.error || '新增失敗');
          errEl.hidden = false;
        }
      });
      refreshCardHeads();

      const okCount = results.filter(r => r.ok).length;
      const errCount = results.length - okCount;
      renderResults(results);
      if (errCount === 0) {
        showAlert('ok', `✅ 已新增 ${okCount} 位客戶`);
        form.hidden = true;
        postActions.hidden = false;
      } else {
        showAlert('err', `⚠️ ${okCount} 位成功、${errCount} 位失敗 — 請修正下方紅字後再按「儲存」`);
        submitBtn.disabled = false;
        submitBtn.textContent = '儲存';
      }
      window.scrollTo(0, 0);
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      // HTML5 必填驗證（name / short_name / address / category）
      if (!form.checkValidity()) {
        showAlert('err', '❌ 請完整填寫必填欄位（姓名 / 簡稱 / 地址 / 類別）');
        form.reportValidity();
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = '儲存中…';
      // 每步都打 console.log 並標 stage，出錯時顯示哪一步炸的
      let _stage = 'init';
      try {
        _stage = 'idToken';
        const idToken = _safeIdToken();
        console.log('[submit] idToken len=', idToken.length);

        _stage = 'payload';
        const submittedCards = cards();
        let url, payload;
        if (MODE === 'edit') {
          // 編輯維持單筆 payload — 後端行為完全不變
          url = `/liff/customer/${CUSTOMER_ID}`;
          payload = collectCard(submittedCards[0]);
        } else {
          // 新增：一次多筆 {customers: [...]}，後端逐筆處理＋單次整合推播
          url = '/liff/customer';
          payload = { customers: submittedCards.map(collectCard) };
        }

        // 讀 source — 同時看 window.location.search 和 liff.state（iOS LIFF 有時不解 liff.state）
        _stage = 'readSource';
        const src = _readSource();
        if (src) payload.source = src;
        console.log('[submit] payload.source=', payload.source);

        _stage = 'fetch';
        const resp = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + idToken,
          },
          body: JSON.stringify(payload),
        });

        _stage = 'parseJson';
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);

        _stage = 'success';
        if (MODE === 'edit') {
          const inClient = liff.isInClient && liff.isInClient();
          if (inClient) {
            showAlert('ok', `✅ 已更新客戶 #${data.customer.id}（1.5 秒後關閉）`);
            setTimeout(() => liff.closeWindow(), 1500);
          } else {
            showAlert('ok', `✅ 已更新客戶 #${data.customer.id}（可關閉視窗）`);
          }
        } else {
          handleBatchResults(data.results || [], submittedCards);
        }
      } catch (err) {
        console.error(`[submit] failed at stage=${_stage}`, err);
        showAlert('err', `❌ [${_stage}] ${err.message || err}`);
        submitBtn.disabled = false;
        submitBtn.textContent = '儲存';
      }
    });

    init();
  </script>
</body>
</html>
