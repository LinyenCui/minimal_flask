<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>記錄入金</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 16px; line-height: 1.5; color: #222; max-width: 600px; margin: 0 auto; font-size: 16px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .field { margin-bottom: 14px; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; color: #444; }
    .field .req { color: #c0392b; margin-left: 2px; }
    .field input, .field select {
      width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc;
      border-radius: 6px; background: #fff;
    }
    .field input:focus, .field select:focus { outline: none; border-color: #2E7D32; }
    .helper { font-size: 12px; color: #888; margin-top: 4px; }
    .actions { margin-top: 24px; display: flex; gap: 8px; }
    button { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: 0; cursor: pointer; }
    button[type=submit] { background: #2E7D32; color: #fff; font-weight: 600; }
    button[type=submit]:disabled { background: #aaa; }
    button.secondary { background: #f3f3f3; color: #333; }
    .alert { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .alert.err { background: #fdecea; color: #c0392b; border: 1px solid #f5c2bf; }
    .alert.ok { background: #e8f5e9; color: #1a7a1a; border: 1px solid #b8e0bb; }
    /* chat_text 協議：sendMessages 失敗時的「複製結果」fallback 區塊 */
    .chat-fallback { margin: 12px 0; padding: 10px 12px; border: 1px solid #ffd180; background: #fff8e1; border-radius: 6px; font-size: 14px; color: #5f4300; }
    .chat-fallback[hidden] { display: none; }
    .chat-fallback pre { white-space: pre-wrap; word-break: break-word; background: #fff; border: 1px solid #eee; border-radius: 4px; padding: 8px; font-size: 13px; margin: 8px 0; }
    .chat-fallback button { width: 100%; padding: 10px; font-size: 15px; border: 0; border-radius: 6px; background: #06c755; color: #fff; font-weight: 600; cursor: pointer; }
    .loading { text-align: center; color: #666; padding: 40px 0; }
  </style>
</head>
<body>
  <div id="loading" class="loading">載入中…</div>
  <div id="content" hidden>
    <h2>➕ 記錄入金</h2>
    <div id="alert"></div>
    <div id="chat-fallback" class="chat-fallback" hidden>
      <div>⚠️ 無法自動發送，請複製後貼到聊天室留存</div>
      <pre id="chat-fallback-text"></pre>
      <button type="button" id="btn-copy-chat" onclick="copyFallbackText()">📋 複製結果</button>
    </div>
    <form id="deposit-form" novalidate>

      <div class="field">
        <label>入金日期<span class="req">*</span></label>
        <input name="deposit_date" type="date" required>
        <div class="helper">時間鎖定 09:00（業務慣例）</div>
      </div>

      <div class="field">
        <label>金額（NT$）<span class="req">*</span></label>
        <input name="amount" type="number" min="1" required placeholder="例：30415">
      </div>

      <div class="field">
        <label>銀行名稱<span class="req">*</span></label>
        <input name="bank_name" type="text" required maxlength="50" placeholder="例：合作金庫 / 玉山銀行">
      </div>

      <div class="field">
        <label>帳號後四碼<span class="req">*</span></label>
        <input name="last4" type="text" required pattern="[0-9]{4}" inputmode="numeric" maxlength="4" placeholder="例：8123">
        <div class="helper">必須是 4 位數字</div>
      </div>

      <div class="actions">
        <button type="button" class="secondary" id="btn-cancel">取消</button>
        <button type="submit" id="btn-submit">確認記錄</button>
      </div>
    </form>
  </div>

  <script>
    const LIFF_ID = "{{ liff_id }}";

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const alertEl = document.getElementById('alert');
    const form = document.getElementById('deposit-form');
    const submitBtn = document.getElementById('btn-submit');
    const cancelBtn = document.getElementById('btn-cancel');

    function showAlert(type, msg) { alertEl.innerHTML = `<div class="alert ${type}">${msg}</div>`; }
    function clearAlert() { alertEl.innerHTML = ''; }

    // 防 LIFF SDK 偶爾回傳含 \r \n \0 的 idToken 導致 Headers.set 炸
    // (iOS Safari WebView 上常見「The string did not match the expected pattern.」)
    function _safeIdToken() {
      const t = liff.getIDToken();
      if (!t) {
        console.warn('[_safeIdToken] getIDToken returned falsy:', t);
        return '';
      }
      // 先 trim 兩邊空白，再 strip 所有非「ASCII printable」字元（0x21-0x7E）
      // JWT idToken 應該只含 [A-Za-z0-9_\-\.]，任何非該範圍都不該保留
      const cleaned = t.trim().replace(/[^\x21-\x7E]/g, '');
      if (cleaned.length !== t.length) {
        const codes = Array.from(t.slice(0, 30))
          .map(c => c.charCodeAt(0).toString(16))
          .join(' ');
        console.warn(
          `[_safeIdToken] cleaned ${t.length - cleaned.length} bad chars; ` +
          `original len=${t.length}, clean len=${cleaned.length}, ` +
          `first 30 hex: ${codes}`
        );
      }
      return cleaned;
    }

    // ===== chat_text 協議：以用戶身分把結果發進聊天室（免 push 額度）=====
    // 可發送條件：LINE app 內、且從聊天室（1對1/群組/多人）打開（liff.init 後有效）
    function _canSend() {
      try {
        const ctx = (liff.getContext && liff.getContext()) || {};
        return !!(liff.isInClient && liff.isInClient()) &&
          ['utou', 'room', 'group'].includes(ctx.type || '');
      } catch (e) { return false; }
    }

    function showCopyFallback(text) {
      const box = document.getElementById('chat-fallback');
      if (!box) return;
      document.getElementById('chat-fallback-text').textContent = text;
      box.hidden = false;
    }

    async function copyFallbackText() {
      const btn = document.getElementById('btn-copy-chat');
      const text = document.getElementById('chat-fallback-text').textContent;
      let copied = false;
      try {
        await navigator.clipboard.writeText(text);
        copied = true;
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        try { copied = document.execCommand('copy'); } catch (e2) { copied = false; }
        document.body.removeChild(ta);
      }
      if (btn) btn.textContent = copied ? '✅ 已複製' : '❌ 複製失敗，請長按文字複製';
    }

    // 成功回應含 chat_text → liff.sendMessages 發進聊天室（不吃 push 額度）
    // 回傳：true=已發送 / false=發送失敗(已顯示複製 fallback) / null=沒 chat_text 或不可發送
    async function deliverChatText(chatText) {
      if (!chatText || !_canSend()) return null;
      try {
        await liff.sendMessages([{ type: 'text', text: chatText }]);
        return true;
      } catch (e) {
        console.warn('[chat_text] sendMessages failed', e);
        showCopyFallback(chatText);
        return false;
      }
    }
    function setLoading(t) { loadingEl.textContent = t; loadingEl.hidden = false; contentEl.hidden = true; }
    function showContent() { loadingEl.hidden = true; contentEl.hidden = false; }

    function _today() {
      const d = new Date();
      const yy = d.getFullYear();
      const mm = String(d.getMonth() + 1).padStart(2, '0');
      const dd = String(d.getDate()).padStart(2, '0');
      return `${yy}-${mm}-${dd}`;
    }

    async function init() {
      if (!LIFF_ID) { setLoading('LIFF_ID 未設定'); return; }
      try { await liff.init({ liffId: LIFF_ID }); }
      catch (e) { setLoading('LIFF init 失敗：' + e.message); return; }
      if (!liff.isLoggedIn()) {
        // PC LIFF OAuth2 redirect_uri 必須在白名單 — 用 LIFF URL 才會通過
        liff.login({ redirectUri: 'https://liff.line.me/' + LIFF_ID + window.location.search });
        return;
      }
      // 預設今天
      form.elements.namedItem('deposit_date').value = _today();
      showContent();
    }

    cancelBtn.addEventListener('click', () => {
      if (liff.isInClient && liff.isInClient()) liff.closeWindow();
      else history.back();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      submitBtn.disabled = true;
      submitBtn.textContent = '記錄中…';
      try {
        const idToken = _safeIdToken();
        const fd = new FormData(form);
        const payload = {
          deposit_date: fd.get('deposit_date'),
          amount: parseInt(fd.get('amount'), 10),
          bank_name: fd.get('bank_name'),
          last4: fd.get('last4'),
        };

        // 從 URL params 拿真實 group/room ID（liff.getContext 給的 UUID 不能用）
        const _params = new URLSearchParams(window.location.search);
        const _gid = _params.get('gid');
        const _rid = _params.get('rid');
        if (_gid) payload.source = { type: 'group', groupId: _gid, roomId: null };
        else if (_rid) payload.source = { type: 'room', groupId: null, roomId: _rid };
        // chat_text 協議：可 sendMessages 就告訴後端別 push（免額度）
        payload.client_can_send = _canSend();

        const resp = await fetch('/liff/accounting/deposit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + idToken,
          },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);

        // chat_text 協議：先以用戶身分把結果發進聊天室，失敗顯示複製 fallback（不自動關窗）
        const sent = await deliverChatText(data.chat_text);
        const inClient = liff.isInClient && liff.isInClient();
        if (sent === false) {
          showAlert('ok', `✅ 已記錄入金 NT$ ${data.amount.toLocaleString()} — 無法自動發送結果，請複製下方內容貼到聊天室後再關閉`);
        } else if (inClient) {
          showAlert('ok', `✅ 已記錄入金 NT$ ${data.amount.toLocaleString()}${sent ? '，結果已發送到聊天室' : ''}（1.5 秒後關閉）`);
          setTimeout(() => liff.closeWindow(), 1500);
        } else {
          showAlert('ok', `✅ 已記錄入金 NT$ ${data.amount.toLocaleString()}（可關閉視窗）`);
        }
      } catch (err) {
        showAlert('err', '❌ ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = '確認記錄';
      }
    });

    init();
  </script>
</body>
</html>
