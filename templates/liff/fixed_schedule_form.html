<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>新增固定班次</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang TC", "Microsoft JhengHei", sans-serif; padding: 16px; line-height: 1.5; color: #222; max-width: 600px; margin: 0 auto; font-size: 16px; }
    h2 { margin: 0 0 16px; font-size: 20px; }
    .field { margin-bottom: 14px; }
    .field.row { display: flex; gap: 8px; }
    .field.row > div { flex: 1; }
    .field label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 14px; color: #444; }
    .field .req { color: #c0392b; margin-left: 2px; }
    .field input, .field select, .field textarea {
      width: 100%; padding: 10px 12px; font-size: 16px; border: 1px solid #ccc;
      border-radius: 6px; background: #fff;
    }
    .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: #06c755; }
    .actions { margin-top: 24px; display: flex; gap: 8px; }
    button { flex: 1; padding: 12px; font-size: 16px; border-radius: 6px; border: 0; cursor: pointer; }
    button[type=submit] { background: #06c755; color: #fff; font-weight: 600; }
    button[type=submit]:disabled { background: #aaa; }
    button.secondary { background: #f3f3f3; color: #333; }
    .alert { padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 14px; }
    .alert.err { background: #fdecea; color: #c0392b; border: 1px solid #f5c2bf; }
    .alert.ok { background: #e8f5e9; color: #1a7a1a; border: 1px solid #b8e0bb; }
    .loading { text-align: center; color: #666; padding: 40px 0; }
    details { margin-bottom: 14px; border: 1px solid #eee; border-radius: 6px; padding: 8px 12px; }
    details summary { font-weight: 600; cursor: pointer; padding: 4px 0; color: #555; }
    details[open] { background: #fafafa; }
    .weekday-row { display: flex; gap: 6px; flex-wrap: wrap; }
    .weekday-row label {
      flex: 1; min-width: 38px; text-align: center;
      padding: 8px 4px; border: 1px solid #ccc; border-radius: 6px;
      cursor: pointer; user-select: none; font-weight: normal;
      background: #fff;
    }
    .weekday-row input { display: none; }
    .weekday-row input:checked + span { display: block; }
    .weekday-row label:has(input:checked) {
      background: #06c755; color: #fff; border-color: #06c755; font-weight: 600;
    }
    .helper { font-size: 12px; color: #888; margin-top: 4px; }
  </style>
</head>
<body>
  <div id="loading" class="loading">載入中…</div>
  <div id="content" hidden>
    <h2 id="form-title">📅 新增固定班次模板</h2>
    <div id="alert"></div>
    <form id="schedule-form" novalidate>

      <div class="field">
        <label>每週幾<span class="req">*</span></label>
        <div class="weekday-row">
          <label><input type="checkbox" name="weekday" value="1"><span>一</span></label>
          <label><input type="checkbox" name="weekday" value="2"><span>二</span></label>
          <label><input type="checkbox" name="weekday" value="3"><span>三</span></label>
          <label><input type="checkbox" name="weekday" value="4"><span>四</span></label>
          <label><input type="checkbox" name="weekday" value="5"><span>五</span></label>
          <label><input type="checkbox" name="weekday" value="6"><span>六</span></label>
          <label><input type="checkbox" name="weekday" value="7"><span>日</span></label>
        </div>
        <div class="helper">點選一個或多個（一週中固定哪幾天執行）</div>
      </div>

      <div class="field">
        <label>出發時間<span class="req">*</span></label>
        <input name="departure_time" type="time" required>
      </div>

      <div class="field">
        <label>類別<span class="req">*</span></label>
        <select name="category" required>
          <option value="">請選擇</option>
          <option value="診所">診所</option>
          <option value="東洋">東洋</option>
          <option value="臨時">臨時</option>
        </select>
      </div>

      <div class="field">
        <label>起點<span class="req">*</span></label>
        <input name="start_point" type="text" required maxlength="100" placeholder="客戶簡稱（如：龍埔街、東洋後門）">
      </div>

      <div class="field">
        <label>終點</label>
        <input name="end_point" type="text" maxlength="100" placeholder="（選填）">
      </div>

      <div class="field">
        <label>途經</label>
        <input name="via_point" type="text" maxlength="100" placeholder="（選填）">
      </div>

      <details>
        <summary>選填欄位（司機 / 車資 / 方向 / 備註）</summary>

        <div class="field" style="margin-top: 10px;">
          <label>指派司機 ID</label>
          <input name="driver_id" type="text" maxlength="20" placeholder="（選填，例 5386）">
        </div>

        <div class="field row">
          <div>
            <label>基本車資</label>
            <input name="base_fare" type="number" min="0" placeholder="（選填）">
          </div>
          <div>
            <label>加成</label>
            <input name="surcharge" type="number" placeholder="（選填）">
          </div>
        </div>

        <div class="field">
          <label>方向</label>
          <select name="direction">
            <option value="">不指定</option>
            <option value="來">來</option>
            <option value="回">回</option>
            <option value="單">單</option>
          </select>
        </div>

        <div class="field">
          <label>備註</label>
          <textarea name="note" rows="2" maxlength="200"></textarea>
        </div>
      </details>

      <div class="actions">
        <button type="button" class="secondary" id="btn-cancel">取消</button>
        <button type="submit" id="btn-submit">建立模板</button>
      </div>
    </form>
  </div>

  <script>
    const LIFF_ID = "{{ liff_id }}";
    const SERVER_SCHEDULE_ID = {{ schedule_id|tojson }};

    function _readQueryId() {
      const params = new URLSearchParams(window.location.search);
      let id = params.get('id');
      if (id) return parseInt(id, 10) || null;
      const ls = params.get('liff.state');
      if (ls) {
        const stripped = ls.startsWith('?') ? ls.slice(1) : ls;
        id = new URLSearchParams(stripped).get('id');
        if (id) return parseInt(id, 10) || null;
      }
      return null;
    }
    const SCHEDULE_ID = SERVER_SCHEDULE_ID || _readQueryId();
    const MODE = SCHEDULE_ID ? 'edit' : 'create';

    const loadingEl = document.getElementById('loading');
    const contentEl = document.getElementById('content');
    const alertEl = document.getElementById('alert');
    const titleEl = document.getElementById('form-title');
    const form = document.getElementById('schedule-form');
    const submitBtn = document.getElementById('btn-submit');
    const cancelBtn = document.getElementById('btn-cancel');

    function showAlert(type, msg) { alertEl.innerHTML = `<div class="alert ${type}">${msg}</div>`; }
    function clearAlert() { alertEl.innerHTML = ''; }

    // 防 LIFF SDK 偶爾回傳含 \r \n \0 的 idToken 導致 Headers.set 炸
    // (iOS Safari WebView 上常見「The string did not match the expected pattern.」)
    function _safeIdToken() {
      const t = liff.getIDToken();
      if (!t) {
        console.warn('[_safeIdToken] getIDToken returned falsy:', t);
        return '';
      }
      // 先 trim 兩邊空白，再 strip 所有非「ASCII printable」字元（0x21-0x7E）
      // JWT idToken 應該只含 [A-Za-z0-9_\-\.]，任何非該範圍都不該保留
      const cleaned = t.trim().replace(/[^\x21-\x7E]/g, '');
      if (cleaned.length !== t.length) {
        const codes = Array.from(t.slice(0, 30))
          .map(c => c.charCodeAt(0).toString(16))
          .join(' ');
        console.warn(
          `[_safeIdToken] cleaned ${t.length - cleaned.length} bad chars; ` +
          `original len=${t.length}, clean len=${cleaned.length}, ` +
          `first 30 hex: ${codes}`
        );
      }
      return cleaned;
    }
    function setLoading(t) { loadingEl.textContent = t; loadingEl.hidden = false; contentEl.hidden = true; }
    function showContent() { loadingEl.hidden = true; contentEl.hidden = false; }

    async function loadSchedule(id) {
      const idToken = _safeIdToken();
      const resp = await fetch(`/liff/fixed_schedule/${id}`, {
        headers: { 'Authorization': 'Bearer ' + idToken },
      });
      const data = await resp.json();
      if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);
      return data.schedule;
    }

    function fillForm(s) {
      // route_number ('147') → checkbox 勾選對應 weekday
      const rn = s.route_number || '';
      form.querySelectorAll('input[name=weekday]').forEach(el => {
        el.checked = rn.includes(el.value);
      });
      // 其他欄位
      const setVal = (name, val) => {
        const el = form.elements.namedItem(name);
        if (el && val !== null && val !== undefined) el.value = val;
      };
      // departure_time 可能是 'HH:MM:SS'，input type=time 接受 HH:MM 或 HH:MM:SS
      setVal('departure_time', (s.departure_time || '').slice(0, 5));
      setVal('category', s.category);
      setVal('start_point', s.start_point);
      setVal('via_point', s.via_point);
      setVal('end_point', s.end_point);
      setVal('driver_id', s.driver_id);
      setVal('direction', s.direction);
      setVal('base_fare', s.base_fare);
      setVal('surcharge', s.surcharge);
      setVal('note', s.note);
    }

    async function init() {
      if (!LIFF_ID) { setLoading('LIFF_ID 未設定'); return; }
      try {
        await liff.init({ liffId: LIFF_ID });
      } catch (e) {
        setLoading('LIFF init 失敗：' + e.message);
        return;
      }
      if (!liff.isLoggedIn()) {
        liff.login({ redirectUri: window.location.href });
        return;
      }
      // 編輯模式預填
      if (MODE === 'edit') {
        titleEl.textContent = `📅 編輯固定班次 #${SCHEDULE_ID}`;
        submitBtn.textContent = '儲存變更';
        try {
          const s = await loadSchedule(SCHEDULE_ID);
          fillForm(s);
        } catch (e) {
          setLoading('載入失敗：' + e.message);
          return;
        }
      }
      showContent();
    }

    cancelBtn.addEventListener('click', () => {
      if (liff.isInClient && liff.isInClient()) liff.closeWindow();
      else history.back();
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();

      // 蒐集 weekday checkboxes → route_number 字串
      const weekdays = Array.from(form.querySelectorAll('input[name=weekday]:checked'))
        .map(el => el.value)
        .sort()
        .join('');
      if (MODE === 'create' && !weekdays) {
        showAlert('err', '❌ 請至少選一個星期幾');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = MODE === 'edit' ? '儲存中…' : '建立中…';
      try {
        const idToken = _safeIdToken();
        const fd = new FormData(form);
        const payload = {
          route_number: weekdays || null,
          departure_time: fd.get('departure_time'),
          start_point: fd.get('start_point'),
          via_point: fd.get('via_point') || null,
          end_point: fd.get('end_point') || null,
          category: fd.get('category'),
          driver_id: fd.get('driver_id') || null,
          direction: fd.get('direction') || null,
          base_fare: fd.get('base_fare') ? parseInt(fd.get('base_fare'), 10) : null,
          surcharge: fd.get('surcharge') ? parseInt(fd.get('surcharge'), 10) : null,
          note: fd.get('note') || null,
        };

        // 從 URL params 拿真實 group/room ID（liff.getContext 給的 UUID 不能用，
        // 詳見 rewrite/utils/liff_url.py）
        const _params = new URLSearchParams(window.location.search);
        const _gid = _params.get('gid');
        const _rid = _params.get('rid');
        if (_gid) payload.source = { type: 'group', groupId: _gid, roomId: null };
        else if (_rid) payload.source = { type: 'room', groupId: null, roomId: _rid };

        const url = MODE === 'edit'
          ? `/liff/fixed_schedule/${SCHEDULE_ID}`
          : '/liff/fixed_schedule';
        const resp = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': 'Bearer ' + idToken,
          },
          body: JSON.stringify(payload),
        });
        const data = await resp.json();
        if (!data.ok) throw new Error(data.error || `HTTP ${resp.status}`);

        const sid = data.schedule && data.schedule.id;
        const action = MODE === 'edit' ? '更新' : '建立';
        const inClient = liff.isInClient && liff.isInClient();
        if (inClient) {
          showAlert('ok', `✅ 已${action}固定班次 #${sid}（1.5 秒後關閉）`);
          setTimeout(() => liff.closeWindow(), 1500);
        } else {
          showAlert('ok', `✅ 已${action}固定班次 #${sid}（可關閉視窗）`);
        }
      } catch (err) {
        showAlert('err', '❌ ' + err.message);
        submitBtn.disabled = false;
        submitBtn.textContent = MODE === 'edit' ? '儲存變更' : '建立模板';
      }
    });

    init();
  </script>
</body>
</html>
