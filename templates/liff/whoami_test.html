<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIFF whoami test</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; padding: 20px; line-height: 1.55; color: #222; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 4px; overflow-x: auto; font-size: 13px; }
    .ok { color: #1a7a1a; }
    .err { color: #c0392b; }
    button { padding: 10px 18px; font-size: 16px; margin: 6px 4px 6px 0; }
    h2 { margin-top: 0; }
  </style>
</head>
<body>
  <h2>LIFF whoami 測試</h2>
  <div id="status">載入中…</div>
  <p><button id="btn-call" disabled>呼叫 /liff/whoami</button></p>
  <h3>結果</h3>
  <pre id="result">尚未呼叫</pre>

  <script>
    const LIFF_ID = "{{ liff_id }}";
    const statusEl = document.getElementById('status');
    const resultEl = document.getElementById('result');
    const btn = document.getElementById('btn-call');

    async function init() {
      if (!LIFF_ID) {
        statusEl.innerHTML = '<span class="err">LIFF_ID 未從後端注入（env 沒設？）</span>';
        return;
      }
      try {
        await liff.init({ liffId: LIFF_ID });
        const isLoggedIn = liff.isLoggedIn();
        statusEl.innerHTML = `<span class="ok">LIFF init OK · loggedIn=${isLoggedIn}</span>`;
        if (!isLoggedIn) {
          const loginBtn = document.createElement('button');
          loginBtn.textContent = '登入';
          loginBtn.onclick = () => liff.login({ redirectUri: window.location.href });
          statusEl.appendChild(loginBtn);
        } else {
          btn.disabled = false;
        }
      } catch (e) {
        statusEl.innerHTML = `<span class="err">LIFF init 失敗: ${e.message}</span>`;
      }
    }

    btn.addEventListener('click', async () => {
      resultEl.textContent = '呼叫中…';
      try {
        const idToken = liff.getIDToken();
        if (!idToken) throw new Error('getIDToken() 回 null（scope 沒勾 openid？）');
        const resp = await fetch('/liff/whoami', {
          method: 'POST',
          headers: { 'Authorization': 'Bearer ' + idToken },
        });
        const data = await resp.json();
        resultEl.textContent = `HTTP ${resp.status}\n` + JSON.stringify(data, null, 2);
      } catch (e) {
        resultEl.textContent = 'Error: ' + e.message;
      }
    });

    init();
  </script>
</body>
</html>
